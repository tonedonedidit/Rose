# Netlify reads this file from the site's base directory (set Base directory to "desert-modernist").
[build]
  publish = "."
  functions = "netlify/functions"

# Forms post to /api/lead; Netlify routes it to the function.
[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

<title>Force Gilbert Inventory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first app shell. Sticky top bar (menu, title, search), slide-in menu, one task per screen, sticky action bar for the main button. */
:root{
 --bg:#0F1712;--surface:#17221B;--surface2:#1F2D24;--ink:#EAF3E4;--dim:#9DB3A2;--line:#2E4535;
 --brand:#8DC63F;--onbrand:#0F1712;--warn:#F0A93B;--bad:#F07A66;--info:#7DBDF0;--sel:#FFE14D;--mag:#E27BC0;
 --paper:#FFFFFF;--paperink:#111111;
 --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;--body:"Barlow","Segoe UI",system-ui,sans-serif;
 --r:10px;color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F2F5EF;--surface:#FFFFFF;--surface2:#E8EEE3;--ink:#13201A;--dim:#4C6454;--line:#C9D5C2;--brand:#3F7F0E;--onbrand:#FFFFFF;--warn:#965A00;--bad:#B3261E;--info:#1F5F99;--sel:#A87F00;--mag:#9C2A78;color-scheme:light}}
:root[data-theme="light"]{--bg:#F2F5EF;--surface:#FFFFFF;--surface2:#E8EEE3;--ink:#13201A;--dim:#4C6454;--line:#C9D5C2;--brand:#3F7F0E;--onbrand:#FFFFFF;--warn:#965A00;--bad:#B3261E;--info:#1F5F99;--sel:#A87F00;--mag:#9C2A78;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--body);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.35rem}h3{font-size:1.05rem}
p{margin:0}
.dim{color:var(--dim)}.small{font-size:.88rem}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding-block:6px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.ib{width:48px;height:48px;border-radius:var(--r);border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:var(--surface2)}
.bt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.bt b{font:700 1.2rem var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt small{color:var(--dim);font-size:.8rem;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
.dot.live{background:var(--brand)}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
#drawer{position:fixed;inset:0 auto 0 0;width:min(86vw,340px);background:var(--surface);z-index:41;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);border-right:1px solid var(--line);box-shadow:0 0 40px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:no-preference){#drawer{animation:slin .18s ease-out}@keyframes slin{from{transform:translateX(-30px);opacity:0}}}
.dhead{padding:18px 18px 10px;border-bottom:1px solid var(--line)}
.dhead b{font:700 1.1rem var(--display);letter-spacing:.04em}.dhead b span{color:var(--brand)}
.dsec{padding:12px 18px 4px;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700}
.dlink{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:0 14px;border:0;border-radius:var(--r);background:transparent;color:var(--ink);font:600 1.05rem var(--body);text-decoration:none;cursor:pointer}
.dlink:hover{background:var(--surface2)}
.dlink[aria-current="page"]{background:color-mix(in srgb,var(--brand) 18%,var(--surface))}
.dlink.main{min-height:62px;font-size:1.15rem}
.badge{margin-left:auto;background:var(--brand);color:var(--onbrand);font-weight:700;font-size:.8rem;border-radius:999px;padding:2px 9px}

main{padding-block:16px calc(110px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.sec{font:700 .78rem var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:6px 2px -4px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--brand);font-weight:600;min-height:44px;background:none;border:0;padding:0;font-size:1rem;cursor:pointer;align-self:flex-start}

/* buttons & inputs */
button{font:600 1rem var(--body);cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:var(--r);border:2px solid var(--brand);background:transparent;color:var(--ink);font-weight:700;text-decoration:none;font-size:1rem}
.btn.pri{background:var(--brand);color:var(--onbrand)}
.btn.ghost{border-color:var(--line)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:40px;padding:0 14px;font-size:.92rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>.btn{flex:1 1 140px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
label .dim{font-weight:500}
input,select,textarea{font:500 1.05rem var(--body);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:52px;min-width:0;max-width:100%;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none}
input[type="checkbox"]{width:26px;height:26px;min-height:0;accent-color:var(--brand);flex:none}
input[type="file"]{font-size:.9rem;padding:10px}
textarea{min-height:140px;font:500 .9rem ui-monospace,Menlo,Consolas,monospace}
.check{flex-direction:row;align-items:center;gap:12px;font-weight:600;min-height:48px}
.form{display:flex;flex-direction:column;gap:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.err{color:var(--bad);font-weight:600}
.ok{color:var(--brand);font-weight:700}
.warnt{color:var(--warn);font-weight:600}

/* sticky action bar */
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.actbar .in{max-width:1100px;margin:0 auto;display:flex;gap:10px}
.actbar .btn{flex:1}

/* home tiles */
.hello h2{font-size:1.6rem}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:820px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:8px;min-height:150px;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;text-align:left;font:inherit}
.tile:hover{border-color:var(--brand)}
.tile .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--brand) 20%,var(--surface));color:var(--brand);flex:none}
.tile b{font:700 1.15rem var(--display)}
.tile .n{font:700 2rem var(--display);line-height:1;margin-top:auto}
.tile .n small{font:500 .85rem var(--body);color:var(--dim);margin-left:4px}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;width:100%;text-decoration:none;font:inherit}
.row:first-child{border-top:0}
button.row:hover,a.row:hover{background:var(--surface2)}
button.row:disabled{opacity:.6;cursor:default}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .tx b{font-weight:700;overflow-wrap:anywhere}
.row .tx span{color:var(--dim);font-size:.9rem}
.row .rt{text-align:right;font-weight:700}
.row .chev{color:var(--dim);display:flex}
.empty{padding:28px 16px;text-align:center;color:var(--dim)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--brand)}.chip.warn,.chip.uncounted{color:var(--warn)}.chip.bad,.chip.wrong{color:var(--bad)}.chip.info{color:var(--info)}.chip.recount{color:var(--mag)}.chip.dim,.chip.empty,.chip.emptyok{color:var(--dim)}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;overflow-x:auto}
.tabs button{flex:1;min-height:44px;border:0;border-radius:999px;background:transparent;color:var(--ink);font-weight:700;white-space:nowrap;padding:0 14px}
.tabs button[aria-pressed="true"]{background:var(--brand);color:var(--onbrand)}
.tabs button small{opacity:.8;margin-left:4px}

/* quantity entry */
.qty{display:flex;align-items:end;gap:10px;flex-wrap:wrap}
.qty label{flex:1 1 110px}
.qty input{font-size:1.4rem;text-align:center;font-weight:700}
.qty .x{font-weight:700;padding-bottom:14px;color:var(--dim)}
.qty output{flex-basis:100%;font-weight:700;color:var(--brand);font-size:1.05rem}
.big{font:700 2.1rem var(--display);line-height:1.1}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:.95rem;margin:0}.kv dt{color:var(--dim)}.kv dd{margin:0;overflow-wrap:anywhere}
.loc{font-family:var(--display);font-weight:700;color:var(--brand)}
.steps{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:.85rem}
.steps span{display:flex;align-items:center;gap:6px;color:var(--dim)}
.steps span::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid currentColor}
.steps span.done{color:var(--brand)}.steps span.done::before{background:currentColor}
.steps i{width:16px;height:2px;background:var(--line)}
.scan input{font-family:var(--display);font-size:1.3rem;text-transform:uppercase}
.match{min-height:1.4em;font-weight:700}
.prog{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden}.prog i{display:block;height:100%;background:var(--brand)}
.banner{border:2px dashed var(--warn);border-radius:var(--r);padding:10px 14px;font-size:.95rem}
.banner b{color:var(--warn)}
.photo{max-width:160px;border-radius:8px;border:1px solid var(--line);display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font-weight:700;padding:12px 18px;border-radius:999px;z-index:50;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,10px);opacity:0}}}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);border-bottom:2px solid var(--line);padding:8px}
td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
td.n,th.n{text-align:right}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 48px;gap:8px;align-items:center;font-size:.92rem}
.bar .tr{height:16px}.bar .tr i{display:block;height:100%;background:var(--brand);border-radius:0 4px 4px 0;min-width:3px}
.bar b{text-align:right}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-right:6px}

/* map */
.mapgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:14px;align-items:start}
@media (max-width:900px){.mapgrid{grid-template-columns:minmax(0,1fr)}}
#stage{position:relative;height:min(62vh,640px);border-radius:14px;overflow:hidden;background:#16211B;touch-action:none}
@media (max-width:600px){#stage{height:56vh}}
#stage canvas{display:block}
.stagemsg{padding:20px;color:#E3F0DC}
.olay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.olay .lb{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;font:700 .82rem var(--body);padding:5px 10px;border-radius:6px;border:0;min-height:32px;background:#8DC63F;color:#0D1611;white-space:nowrap;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.olay .lb.area{background:rgba(13,22,17,.72);color:#E3F0DC;pointer-events:none;font-size:.7rem;letter-spacing:.08em;min-height:0;box-shadow:none}
.olay .lb.bay{background:rgba(13,22,17,.85);color:#B6E07A;font-size:.75rem;min-height:28px}
.olay .lb.other{background:rgba(141,198,63,.55);font-size:.72rem;min-height:28px}
.olay .lb.sel{background:#FFE14D;color:#111;font-size:1rem;pointer-events:none}
.crumb{position:absolute;left:8px;top:8px;right:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:#E3F0DC;font-weight:700}
.stagebar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#stage .sb{min-height:40px;padding:0 12px;border-radius:8px;border:2px solid #8DC63F;background:rgba(13,22,17,.85);color:#E3F0DC;font-weight:700;font-size:.9rem}
#stage .sb.on{background:#8DC63F;color:#0D1611}
.spotpill{position:absolute;left:8px;right:8px;bottom:58px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:rgba(13,22,17,.9);color:#E3F0DC;border:2px solid #FFE14D;border-radius:10px;padding:8px 12px;font:600 .95rem var(--body)}
.spotpill b{font:700 1.2rem var(--display);color:#FFE14D}.spotpill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.spotpill small{color:#B6E07A}
@media (min-width:901px){.spotpill small{display:none}}
.hintb{background:rgba(13,22,17,.82);color:#E3F0DC;padding:8px 12px;border-radius:8px;font-size:.9rem}
.maptop{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.maptop select{flex:1 1 200px;width:auto}
.spotcard{border:2px solid var(--sel);border-radius:14px;padding:16px;background:var(--surface)}
.elev{display:flex;flex-direction:column;gap:12px}
.bay h3{font-size:.92rem;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvrow{display:grid;gap:4px;margin-bottom:4px}
.sp{min-height:48px;padding:4px;font:600 .78rem var(--body);border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.sp span{font-weight:500;color:var(--dim);overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.sp[data-st="ok"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 20%,var(--bg))}
.sp[data-st="uncounted"]{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,var(--bg))}
.sp[data-st="wrong"]{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--bg))}
.sp[data-st="recount"]{border-color:var(--mag);background:color-mix(in srgb,var(--mag) 20%,var(--bg))}
.sp[aria-current="true"]{outline:3px solid var(--sel);outline-offset:1px}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.85rem;color:var(--dim);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.label{border:2px solid var(--paperink);background:var(--paper);color:var(--paperink);padding:10px;display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:center;border-radius:6px}
.label svg{width:84px;height:84px;display:block}
.label .code{font:700 1.5rem var(--display);line-height:1;overflow-wrap:anywhere}
.label .s{font-size:.75rem;line-height:1.25;margin-top:4px}
details>summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;gap:8px}
</style>

<header class="bar">
 <button class="ib" id="menuB" aria-label="Open menu" aria-expanded="false" aria-controls="drawer"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
 <div class="bt"><b id="ttl">Home</b><small><span class="dot" id="dot"></span><span id="mode">Connecting…</span></small></div>
 <button class="ib" id="findB" aria-label="Search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg></button>
</header>
<div id="scrim" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
"use strict";
/* =========================================================
   LAYOUT. Meters, x = east, z = south. Aisles A–C copy the Gilbert
   rack map; the shop side follows the site photos and video.
   ========================================================= */
const RACKMAP='https://claude.ai/artifact/6H58N7DEKwMkfmE9jZDW1d';
const P=2.8,LY=[.15,1.85,3.55,5.25];
const OFFICE={x0:6,x1:13,z0:-38,z1:-46};
const CATS={board:'Boards',hardware:'Hardware',fastener:'Screws & nails',handle:'Handles',packaging:'Packaging',molding:'Molding',pallet:'Cabinet pallets',misc:'Misc'};
const UNIT={board:'sheets',hardware:'pcs',fastener:'boxes',handle:'pcs',packaging:'rolls',molding:'pcs',pallet:'pallets',misc:'pcs'};
const THK=['3/4"','6mm','1/4"','1/2"','5/8"','Other'];
const isWhite=i=>/white/i.test(i.color||'');
const isCard=i=>i.cat==='packaging'&&/cardboard/i.test(i.name||'');
const BUNK={1:{F:'3/4" double-sided white',B:'3/4" double-sided white'},2:{F:'3/4" colored (front half)',B:'3/4" white (back half)'},3:{F:'3/4" colored',B:'3/4" colored'},4:{F:'6 mm, any color',B:'6 mm, any color'}};
function bunkRule(i,b,s){
 if(i.cat!=='board')return 'Bunks hold boards only.';
 if(b===4)return i.thk==='6mm'?null:'Bunk 4 is 6 mm only.';
 if(i.thk!=='3/4"')return `Bunk ${b} is 3/4" only.`;
 if(b===1)return isWhite(i)&&i.sides==='2S'?null:'Bunk 1 is 3/4" double-sided white only.';
 if(b===2)return s==='B'?(isWhite(i)?null:'The back half of Bunk 2 is white.'):(isWhite(i)?'The front half of Bunk 2 is colored.':null);
 return isWhite(i)?'Bunk 3 is colored 3/4" only.':null;
}
const GR=0x2E8B6E,OR=0xD9531E,GY=0x3B434B;
const shelfRule=i=>['board','pallet','molding'].includes(i.cat)?'The office racks hold small hardware, screws, nails and handles.':null;
const palletRule=i=>i.cat!=='pallet'?'Aisles A, B and C hold cabinet pallets only.':null;
const ZONES=[
 {id:'D',name:'Rack D',kind:'rack',deep:1,fx:-11.1,nd:1,first:1,last:18,levels:4,ly:LY,bw:P,up:GR,beam:OR,
  purpose:L=>L===1?'Installer hardware: drawer and cabinet members, hinges':'Upper levels: use not decided yet',
  rule:(i,L)=>L===1&&i.cat!=='hardware'?'Rack D level 1 is installer hardware only.':null},

 else if(col==='log'){S.log=S.log.filter(e=>e.id!==id);if(data){S.log.unshift({...data,id});S.log.sort((a,b)=>a.t<b.t?1:-1)}}
 else if(col==='meta')S.meta=data||{}}

const stockRows=()=>[['Spot','Area','Part number','Item','Qty','Unit','Last counted','Designated for'],...Object.keys(S.stock).flatMap(l=>{const s=S.stock[l],ls=s.lines&&s.lines.length?s.lines:[{sku:'',qty:''}];return ls.map(x=>[l,zone(LOC[l]?.z)?.name||'',x.sku,item(x.sku)?.name||'',x.qty??'',x.sku?uom(item(x.sku)):'',s.counted?ymd(s.counted):'',s.assign||''])})];
const itemRows=()=>[['Part number','Name','Category','Unit','Pack','Per pack','Vendor','Vendor part #','On hand','On order','Reorder at','Fill to','Cost'],...Object.values(S.items).map(i=>[i.sku,i.name,CATS[i.cat],uom(i),i.pack?.n||'',i.pack?.q||'',i.vendor||'',i.vpn||'',onHand(i.sku).n,onOrder(i.sku),i.min||'',i.max||'',i.cost||''])];
const logRows=()=>[['When','Type','Part number','Item','Qty','From','To','Job/PO','Reason','Who'],...S.log.map(e=>[e.t,e.type,e.sku,item(e.sku)?.name||'',e.qty,e.from||e.at||'',e.to||'',e.job||e.ref||'',e.reason||'',nameOf(e.who)])];
function vSetup(v){
 v.innerHTML=`<div class="stack"><div class="card stack"><h3>Data</h3><p>${MODE==='live'?`<span class="ok">Live and shared.</span> Everyone who opens this page sees the same counts, deliveries and pick lists as they change. Each change is signed with the person's claude.ai name.`:'<span class="warnt">This device only.</span> Open the shared claude.ai link so the whole team works from the same data.'}</p>${!CANWRITE?'<p class="warnt">Your sharing level is view only.</p>':''}
 ${MODE==='local'?`<label>Your name<input id="nm" value="${esc(sget(NKEY)||'')}" placeholder="Shown next to everything you log"></label>`:`<p class="dim small">Signed in as ${esc(ME||'you')}.</p>`}</div>
 <div class="card stack"><h3>Copy into Google Sheets or Excel</h3><p class="dim">Copies rows and columns. Click cell A1 in a sheet and paste.</p><div class="btns"><button class="btn" data-cp="stock">Stock by spot</button><button class="btn" data-cp="items">Items</button><button class="btn" data-cp="log">History</button></div>
  <div class="btns"><button class="btn ghost sm" data-dl="stock">Download stock .csv</button><button class="btn ghost sm" data-dl="items">Download items .csv</button><button class="btn ghost sm" data-dl="log">Download history .csv</button></div>
  <p class="dim small">Live two-way sync with a Google Sheet is the next step. It needs the Google Drive connector set up for the team.</p></div>
 <div class="card stack"><h3>How the work flows</h3><p class="dim small"><b>Incoming:</b> the office imports or adds POs. The floor checks each delivery in, the office confirms the paperwork, then items are put away into their designated spots.<br><b>Outgoing:</b> job pulls, sheets to the saw, pallet shipments and vendor returns each get a pick list.<br>Every change is logged with who and when.</p></div></div>`;
 const n=$('#nm');if(n)n.oninput=()=>sset(NKEY,n.value.trim());
 const R={stock:stockRows,items:itemRows,log:logRows};
 $$('[data-cp]').forEach(b=>b.onclick=()=>copyText(tsv(R[b.dataset.cp]()),'Copied. Paste into cell A1.'));
 $$('[data-dl]').forEach(b=>b.onclick=()=>saveFile(`force-${b.dataset.dl}-${today()}.csv`,R[b.dataset.dl]().map(r=>r.map(c=>/[",\n]/.test(String(c??''))?`"${String(c).replace(/"/g,'""')}"`:String(c??'')).join(',')).join('\n')))}

boot();
</script>

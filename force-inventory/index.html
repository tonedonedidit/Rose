<title>Force Gilbert Inventory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky header with scan/search + tab bar; one view at a time; two-column work areas stack at phone width. Look matches the Gilbert rack map. */
:root{
 --bg:#0D1611;--panel:#13201A;--panel2:#1A2B21;--ink:#E3F0DC;--dim:#8EA894;--line:#2C4636;--lime:#8DC63F;--onlime:#0D1611;--sel:#FFE14D;
 --warn:#E8A23A;--bad:#F07A66;--mag:#E27BC0;--paper:#FFFFFF;--paperink:#111111;
 --font:"Chakra Petch","Segoe UI",system-ui,sans-serif;
 color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#EEF2EB;--panel:#FAFCF8;--panel2:#E6EDE2;--ink:#14231A;--dim:#4F6857;--line:#BFCDB8;--lime:#3F7F0E;--onlime:#FFFFFF;--sel:#B08900;--warn:#9A5B00;--bad:#B3261E;--mag:#9C2A78;color-scheme:light}}
:root[data-theme="light"]{--bg:#EEF2EB;--panel:#FAFCF8;--panel2:#E6EDE2;--ink:#14231A;--dim:#4F6857;--line:#BFCDB8;--lime:#3F7F0E;--onlime:#FFFFFF;--sel:#B08900;--warn:#9A5B00;--bad:#B3261E;--mag:#9C2A78;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--lime)}
.hrow{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:10px 6px}
.brand{font-weight:700;letter-spacing:.04em;font-size:1.2rem;line-height:1.1;margin-right:auto}.brand .f{color:var(--lime)}
.brand small{display:block;font-weight:500;letter-spacing:0;color:var(--dim);font-size:.78rem}
.gs{flex:1 1 300px;max-width:520px;display:flex}
.gs input{flex:1;border-color:var(--lime)}
.who{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--dim);font-weight:600}
.who input{width:120px}
.demo-badge{background:var(--warn);color:var(--onlime);font-weight:700;font-size:.75rem;padding:3px 8px;border-radius:2px;letter-spacing:.06em}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:0 8px;scrollbar-width:thin}
nav.tabs a{flex:none;font-weight:700;font-size:.92rem;text-decoration:none;color:var(--ink);padding:7px 12px;border:2px solid var(--line);border-radius:3px;background:var(--panel)}
nav.tabs a[aria-current="page"]{background:var(--lime);border-color:var(--lime);color:var(--onlime)}
main{padding-block:14px 48px}
h1{font-size:1.45rem;margin:0 0 4px;text-wrap:balance}
h2{font-size:1.08rem;margin:0 0 8px;text-wrap:balance}
p{margin:0 0 8px}
.dim{color:var(--dim)}.small{font-size:.82rem}
.card{border:1px solid var(--line);background:var(--panel);padding:12px;min-width:0}
.card.hi{border:2px solid var(--lime)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.gsplit{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:14px;align-items:start}
.gcount{display:grid;grid-template-columns:minmax(240px,340px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.grid2,.gsplit,.gcount{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px}
input,select,textarea{font:500 1rem var(--font);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:3px;padding:8px 10px;min-width:0}
select,input{max-width:100%}
input[type="checkbox"]{width:22px;height:22px;accent-color:var(--lime)}
:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;font-weight:600;color:var(--dim)}
label.inline{flex-direction:row;align-items:center;gap:8px;font-size:.9rem;color:var(--ink)}
button{font:700 .98rem var(--font);padding:9px 16px;border:2px solid var(--lime);background:var(--panel);color:var(--ink);border-radius:3px;cursor:pointer;min-height:44px}
button.go{background:var(--lime);color:var(--onlime)}
button.ghost{border-color:var(--line)}
button.danger{border-color:var(--bad);color:var(--bad)}
button.sm{padding:5px 10px;font-size:.85rem;min-height:34px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row>label{flex:1 1 150px;min-width:0}
input[type="file"]{width:100%;font-size:.85rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:6px 11px;font-size:.88rem;min-height:38px;border-color:var(--line)}
.chips button small{font-weight:500;opacity:.8;margin-left:4px}
.chips button[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--onlime)}
.banner{border:2px dashed var(--warn);padding:8px 12px;margin-block:0 14px;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner b{color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.tile{border:1px solid var(--line);background:var(--panel);padding:10px 12px}
.tile span{display:block;font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.tile b{display:block;font-size:1.7rem;line-height:1.2}
.tile em{display:block;font-style:normal;font-size:.8rem;color:var(--dim)}
.tile.alert b{color:var(--warn)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:600;border-bottom:2px solid var(--line);padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.pill{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:2px;border:1.5px solid currentColor;white-space:nowrap;vertical-align:1px}
.pill.low,.pill.uncounted,.pill.ph{color:var(--warn)}.pill.out,.pill.wrong{color:var(--bad)}.pill.ok{color:var(--lime)}.pill.recount{color:var(--mag)}.pill.empty,.pill.emptyok{color:var(--dim)}
.pill.ph{border-style:dashed}
.sw{display:inline-block;width:14px;height:14px;border:1px solid var(--line);vertical-align:-2px;margin-right:6px;border-radius:2px}
.loc{font-weight:700;color:var(--lime);white-space:nowrap}
a.loc{text-decoration:none}a.loc:hover{text-decoration:underline}
.locs{display:flex;gap:4px 10px;flex-wrap:wrap}
.result{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;justify-content:space-between;align-items:start;flex-wrap:wrap}
.result:first-of-type{border-top:0}
.result .what{min-width:0;flex:1 1 260px}
.big{font-size:1.3rem;font-weight:700}
.prog{height:10px;background:var(--panel2);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--lime)}
.phase{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:start;border-top:1px solid var(--line);padding:10px 0}
.phase:first-of-type{border-top:0}
.phase .num{font-weight:700;font-size:1.1rem;color:var(--lime)}
.phase .prog{grid-column:2/4;margin-top:2px}
.zrow{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 70px;gap:8px;align-items:center;font-size:.9rem;padding:3px 0}
.zrow .v{text-align:right;color:var(--dim)}
.feed{list-style:none;margin:0;padding:0}
.feed li{border-top:1px solid var(--line);padding:7px 0;display:flex;gap:8px;justify-content:space-between;align-items:baseline;flex-wrap:wrap;font-size:.9rem}
.feed li:first-child{border-top:0}
.feed .t{color:var(--dim);font-size:.78rem;white-space:nowrap}
.tag{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:2px;background:var(--panel2);margin-right:5px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(110px,200px) minmax(0,1fr) 52px;gap:8px;align-items:center;font-size:.9rem}
.bar .track{height:18px;position:relative}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--lime);border-radius:0 4px 4px 0;min-width:3px}
.bar .v{text-align:right;font-weight:700}
.empty{color:var(--dim);padding:14px 0;text-align:center}
.err{color:var(--bad);font-weight:600}
.warnt{color:var(--warn);font-weight:600}
.hint{font-size:.85rem;color:var(--dim);min-height:1.2em}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.acts button{min-height:62px;line-height:1.15;border-color:var(--line)}
.acts button small{display:block;font-weight:500;font-size:.74rem;color:var(--dim)}
.acts button[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--onlime)}
.acts button[aria-pressed="true"] small{color:var(--onlime)}
.form{display:flex;flex-direction:column;gap:10px}
.views{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
#stage{height:min(66vh,660px);position:relative;background:var(--panel2);border:1px solid var(--line);overflow:hidden;touch-action:none}
#stage canvas{display:block}
.stagemsg{padding:20px}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.8rem;color:var(--dim);margin-top:8px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.clist{max-height:62vh;overflow:auto;border:1px solid var(--line)}
.clist button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:var(--panel);min-height:44px;padding:8px 10px;font-size:.92rem}
.clist button[aria-current="true"]{background:var(--panel2);outline:3px solid var(--lime);outline-offset:-3px}
.clist .lv{font-size:.72rem;color:var(--dim);padding:6px 10px;background:var(--bg);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.cl{display:grid;grid-template-columns:minmax(0,1fr) 110px 44px;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.cl input{width:100%;font-size:1.15rem;text-align:right}
.photo{max-width:120px;border:1px solid var(--line);border-radius:2px;display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pk{border:1px solid var(--line);background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pk .where{font-size:1.5rem;font-weight:700;color:var(--lime);line-height:1}
.step{display:flex;gap:6px;align-items:stretch}
.step input{width:80px;text-align:center;font-size:1.2rem}
.step button{min-width:48px;padding:0}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.label{border:2px solid var(--paperink);background:var(--paper);color:var(--paperink);padding:10px;display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:center;break-inside:avoid;min-width:0}
.label .qr svg{width:92px;height:92px;display:block}
.label .qr.none{width:92px;height:92px;border:1px dashed var(--paperink);display:grid;place-items:center;font-size:.7rem;text-align:center}
.label .code{font-size:1.65rem;font-weight:700;line-height:1;overflow-wrap:anywhere}
.label .sub{font-size:.75rem;line-height:1.25;margin-top:4px}
textarea{width:100%;min-height:130px;font-size:.8rem;font-family:ui-monospace,Menlo,Consolas,monospace}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--lime);color:var(--onlime);font-weight:700;padding:10px 16px;border-radius:3px;z-index:20;max-width:calc(100% - 32px)}
.confirm{border:2px solid var(--bad);padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
details summary{cursor:pointer;font-weight:700;padding-block:4px}
a{color:var(--lime)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;font-size:.88rem}.kv dt{color:var(--dim)}.kv dd{margin:0}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,10px);opacity:0}}}
@media print{header,#banner,.noprint,#toast,body::before{display:none!important}body{background:#fff}main{padding:0}.labels{grid-template-columns:repeat(3,1fr);gap:6px}.wrap{padding:0}}
</style>

<script>
"use strict";
/* =========================================================
   LAYOUT. Sizes and positions in meters, x = east, z = south.
   Aisles A–C copy the Gilbert rack map. Everything else follows the
   hand sketch and is a placeholder until we measure from photos.
   ========================================================= */
const RACKMAP='https://claude.ai/artifact/6H58N7DEKwMkfmE9jZDW1d';
const P=2.8, LY=[.15,1.85,3.55,5.25];          // rack bay width, beam heights
const OFFICE={x0:6,x1:14,z0:-38,z1:-45};
const CATS={board:['Boards','sheets'],hardware:['Hardware','pcs'],fastener:['Screws & nails','boxes'],handle:['Handles','pcs'],packaging:['Packaging','rolls'],molding:['Molding','pcs'],pallet:['Cabinet pallets','pallets'],misc:['Misc','pcs']};
const THK=['3/4"','6mm','1/4"','1/2"','5/8"','Other'];
const isWhite=i=>/white/i.test(i.color||'');
const isCard=i=>i.cat==='packaging'&&/cardboard/i.test(i.name);
const BUNK={1:{F:'3/4" double-sided white',B:'3/4" double-sided white'},2:{F:'3/4" colored (front half)',B:'3/4" white (back half)'},3:{F:'3/4" colored',B:'3/4" colored'},4:{F:'6 mm, any color',B:'6 mm, any color'}};
function bunkRule(i,b,s){
 if(i.cat!=='board')return 'Bunks hold boards only.';
 if(b===4)return i.thk==='6mm'?null:'Bunk 4 is 6 mm only.';
 if(i.thk!=='3/4"')return `Bunk ${b} is 3/4" only.`;
 if(b===1)return isWhite(i)&&i.sides==='2S'?null:'Bunk 1 is 3/4" double-sided white only.';
 if(b===2)return s==='B'?(isWhite(i)?null:'The back half of Bunk 2 is white.'):(isWhite(i)?'The front half of Bunk 2 is colored.':null);
 return isWhite(i)?'Bunk 3 is colored 3/4" only.':null;
}
const ZONES=[
 {id:'D',name:'Rack D',kind:'rack',deep:1,fx:-11.1,nd:1,first:1,last:18,
  purpose:L=>L===1?'Installer hardware: drawer and cabinet members, hinges':'Upper levels: use not decided yet',
  rule:(i,L)=>L===1&&i.cat!=='hardware'?'Rack D level 1 is installer hardware only.':null},
 {id:'C',name:'Aisle C',kind:'rack',deep:1,fx:-8.05,nd:-1,first:5,last:18,purpose:()=>'Cabinet pallets only',rule:i=>i.cat!=='pallet'?'Aisles A, B and C hold cabinet pallets only.':null},
 {id:'B',name:'Aisle B',kind:'rack',deep:1,fx:-3.05,nd:1,first:5,last:18,purpose:()=>'Cabinet pallets only',rule:i=>i.cat!=='pallet'?'Aisles A, B and C hold cabinet pallets only.':null},
 {id:'A',name:'Aisle A',kind:'rack',deep:1,fx:0,nd:-1,first:1,last:18,purpose:()=>'Cabinet pallets only',rule:i=>i.cat!=='pallet'?'Aisles A, B and C hold cabinet pallets only.':null},
 {id:'R0',name:'Rack 0',kind:'rack',deep:0,fx:9.4,nd:1,z0:-11,first:1,last:3,ph:1,
  purpose:L=>L===4?'Cardboard only':'Scribe molding, misc, random pallets, drop-off overflow',
  rule:(i,L)=>L===4&&!isCard(i)?'The top level of Rack 0 is cardboard only.':null},
 {id:'R1',name:'Rack 1',kind:'rack',deep:0,fx:6.8,nd:-1,z0:-11,first:1,last:1,ph:1,purpose:()=>'Excess handles (overstock)',rule:i=>i.cat!=='handle'?'Rack 1 holds excess handles only.':null},
 {id:'CL1',name:'Cantilever 1',kind:'cant',x:12.8,z0:-8.5,cols:3,rows:8,ph:1,purpose:()=>'Boards not in the main run: remakes, one-off jobs',rule:i=>i.cat!=='board'?'Cantilevers hold boards only.':null},
 {id:'CL2',name:'Back cantilever',kind:'cant',x:27,z0:-3,cols:1,rows:8,ph:1,purpose:()=>'Boards (single column on the back wall)',rule:i=>i.cat!=='board'?'Cantilevers hold boards only.':null},
 {id:'BK',name:'Bunks',kind:'bunk',x0:17.2,z0:-7.5,ph:1},
 {id:'HR',name:'Office hardware rack',kind:'shelf',x:14.9,z0:-41,bays:2,shelves:5,ph:1,purpose:()=>'Screws, nails and other small hardware',rule:i=>i.cat!=='fastener'?'The office hardware rack is for screws and nails.':null},
 {id:'VR',name:'Not on a shelf',kind:'virtual'}
];
const zone=id=>ZONES.find(z=>z.id===id);

/* ---------- every location, generated ---------- */
const LOCS=[],LOC={},KEYS={};
const key=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9+]/g,'');
function addLoc(o){LOCS.push(o);LOC[o.id]=o;KEYS[key(o.id)]=o.id}
ZONES.forEach(z=>{
 if(z.kind==='rack'){
  for(let r=z.first;r<=z.last;r++)for(let L=1;L<=4;L++){
   const zc=(z.z0||0)-(r-.5)*P,bins=z.deep?(L===4?['a+b','c+d']:['a','b','c','d']):['c','d'];
   bins.forEach(b=>{
    const back=b[0]==='a'||b[0]==='b',dbl=b.length>1,x=z.fx-z.nd*(back?1.8:.6);
    const zz=dbl?zc:(b==='c'||b==='a')?zc+z.nd*2.7/4:zc-z.nd*2.7/4;
    const id=`${z.id}-${L}${r}-${b}`;
    addLoc({id,z:z.id,L,bay:r,bin:b,purpose:z.purpose(L),geo:{x,y:LY[L-1]+.02,z:zz,w:1.1,h:1.25,d:dbl?2.5:1.2,nx:z.nd,nz:0,ax:z.fx+z.nd*2.2}});
    if(dbl)b.split('+').forEach(s=>KEYS[key(`${z.id}-${L}${r}-${s}`)]=id);
   })}
 }else if(z.kind==='cant'){
  for(let c=1;c<=z.cols;c++)for(let r=1;r<=z.rows;r++)
   addLoc({id:`${z.id}-${c}-${r}`,z:z.id,L:r,bay:c,purpose:z.purpose(),geo:{x:z.x+.7,y:.3+(r-1)*.5,z:z.z0-(c-.5)*2.5,w:1.2,h:.4,d:2.3,nx:1,nz:0,ax:z.x+3.2}});
 }else if(z.kind==='bunk'){
  for(let b=1;b<=4;b++)['F','B'].forEach(s=>addLoc({id:`BK${b}-${s}`,z:'BK',bunk:b,side:s,purpose:BUNK[b][s],geo:{x:z.x0+(b-1)*2.4,y:.15,z:s==='F'?z.z0-1.3:z.z0-3.8,w:1.3,h:2.6,d:2.45,nx:0,nz:1}}));
 }else if(z.kind==='shelf'){
  for(let b=1;b<=z.bays;b++)for(let s=1;s<=z.shelves;s++)

   <p class="dim small">CSV opens in Excel or Google Sheets: one row per item per spot.</p><textarea id="b-out" readonly hidden aria-label="Backup text"></textarea></div>
  <div class="card stack"><h2>Restore a backup</h2><label for="b-in">Paste backup text<textarea id="b-in" placeholder='{"v":2, ...}'></textarea></label>
   <div class="row"><label for="b-file">Or open a .json file<input id="b-file" type="file" accept=".json,application/json"></label><button class="go" id="b-load">Restore</button></div><div class="hint" id="b-msg"></div></div>
  <div class="card stack"><h2>Demo data for showing the bosses</h2><p class="small">Demo mode fills the warehouse with made-up stock and a week of activity, so people can see what the reports and 3D map look like once it's running. It is stored separately, and switching back brings your real data back untouched.</p>
   <div class="row">${MODE==='demo'?'<button class="go" id="b-real">Switch to real data</button><button class="ghost" id="b-redemo">Reset the demo</button>':'<button id="b-demo">Show demo data</button>'}</div></div>
  <div class="card stack"><h2>Start over</h2><p class="small">Erases everything in ${MODE==='demo'?'the demo':'your real data'} on this device and goes back to the starting placeholders.</p><div class="row"><button class="danger" id="b-wipe">Erase ${MODE==='demo'?'demo':'real'} data</button></div><div id="b-conf"></div>
   <ul class="feed"><li><span>Items</span><b>${S.items.length}</b></li><li><span>Spots</span><b>${PHYS.length}</b></li><li><span>Log entries</span><b>${S.log.length}</b></li><li><span>Saving on this device</span><b>${saveOK?'Yes':'No'}</b></li></ul></div>
 </div>`;
 const json=()=>JSON.stringify(S);
 $('#b-copy').onclick=()=>copyText(json(),$('#b-out'));
 const dl=$('#b-dl');if(dl)dl.onclick=()=>download(`force-inventory-${MODE}-${ymd(Date.now())}.json`,json(),'application/json');
 $('#b-csv').onclick=()=>copyText(csv(),$('#b-out'));
 $('#b-file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>$('#b-in').value=r.result;r.readAsText(f)};
 $('#b-load').onclick=()=>{try{const d=JSON.parse($('#b-in').value);if(!d||d.v!==2||!Array.isArray(d.items)||!d.stock)throw 0;S=d;save();refresh3D();toast('Backup restored');go('home')}catch(e){$('#b-msg').innerHTML='<span class="err">That is not a backup from this app. Paste the whole text, starting with {"v":2.</span>'}};
 const dm=$('#b-demo');if(dm)dm.onclick=()=>{setMode('demo');toast('Showing demo data');go('home')};
 const rl=$('#b-real');if(rl)rl.onclick=()=>{setMode('real');toast('Showing real data');go('home')};
 const rd=$('#b-redemo');if(rd)rd.onclick=()=>{S=demo();save();refresh3D();toast('Demo reset');go('home')};
 $('#b-wipe').onclick=()=>{$('#b-conf').innerHTML=`<div class="confirm"><span>Erase all ${MODE} data on this device? Copy a backup first if you might want it.</span><button class="danger sm" id="b-yes">Yes, erase</button><button class="ghost sm" id="b-no">Cancel</button></div>`;
  $('#b-yes').onclick=()=>{S=MODE==='demo'?demo():blank();save();refresh3D();toast('Erased');go('home')};$('#b-no').onclick=()=>$('#b-conf').innerHTML=''};
}

/* ---------- boot ---------- */
load();route();
</script>

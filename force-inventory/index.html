<title>Force Shop Inventory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky header + tab bar, one view at a time; map and lists stack at phone width. Look matches the Gilbert rack map. */
:root{
 --bg:#0D1611;--panel:#13201A;--panel2:#1A2B21;--grid:#162820;--grid2:#1F3A2B;
 --ink:#E3F0DC;--dim:#8EA894;--line:#2C4636;--lime:#8DC63F;--onlime:#0D1611;--sel:#FFE14D;
 --warn:#E8A23A;--bad:#F07A66;--teal:#1E7A6A;
 --font:"Chakra Petch","Segoe UI",system-ui,sans-serif;
 color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#EEF2EB;--panel:#FAFCF8;--panel2:#E6EDE2;--grid:#DFE7DA;--grid2:#C9D7C2;--ink:#14231A;--dim:#4F6857;--line:#BFCDB8;--lime:#3F7F0E;--onlime:#FFFFFF;--sel:#C79A00;--warn:#9A5B00;--bad:#B3261E;color-scheme:light}}
:root[data-theme="light"]{--bg:#EEF2EB;--panel:#FAFCF8;--panel2:#E6EDE2;--grid:#DFE7DA;--grid2:#C9D7C2;--ink:#14231A;--dim:#4F6857;--line:#BFCDB8;--lime:#3F7F0E;--onlime:#FFFFFF;--sel:#C79A00;--warn:#9A5B00;--bad:#B3261E;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--lime)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:10px 6px}
.brand{font-weight:700;letter-spacing:.04em;font-size:1.25rem;line-height:1.1}.brand .f{color:var(--lime)}
.brand small{display:block;font-weight:500;letter-spacing:0;color:var(--dim);font-size:.8rem}
.who{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--dim)}
.who input{width:130px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:0 8px;scrollbar-width:thin}
nav.tabs a{flex:none;font-weight:700;text-decoration:none;color:var(--ink);padding:8px 14px;border:2px solid var(--line);border-radius:3px;background:var(--panel)}
nav.tabs a[aria-current="page"]{background:var(--lime);border-color:var(--lime);color:var(--onlime)}
main{padding-block:14px 40px}
h1{font-size:1.5rem;margin:0 0 4px;text-wrap:balance}
h2{font-size:1.1rem;margin:0 0 8px;text-wrap:balance}
p{margin:0 0 8px}
.dim{color:var(--dim)}
.small{font-size:.82rem}
.card{border:1px solid var(--line);background:var(--panel);padding:12px;min-width:0}
.card.hi{border:2px solid var(--lime)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.gridmap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:14px;align-items:start}
@media (max-width:900px){.grid2,.gridmap{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px}
input,select,textarea{font:500 1rem var(--font);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:3px;padding:8px 10px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,.hit:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
label{display:flex;flex-direction:column;gap:3px;font-size:.82rem;font-weight:600;color:var(--dim)}
button{font:700 1rem var(--font);padding:9px 16px;border:2px solid var(--lime);background:var(--panel);color:var(--ink);border-radius:3px;cursor:pointer;min-height:44px}
button.go{background:var(--lime);color:var(--onlime)}
button.ghost{border-color:var(--line)}
button.danger{border-color:var(--bad);color:var(--bad)}
button.sm{padding:5px 10px;font-size:.85rem;min-height:34px}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row>label{flex:1 1 160px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:6px 12px;font-size:.9rem;min-height:38px;border-color:var(--line)}
.chips button[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--onlime)}
.banner{border:2px dashed var(--warn);color:var(--ink);padding:8px 12px;margin-block:0 14px;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner b{color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{border:1px solid var(--line);background:var(--panel);padding:10px 12px}
.tile span{display:block;font-size:.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.tile b{font-size:1.7rem;line-height:1.2}
.tile em{display:block;font-style:normal;font-size:.8rem;color:var(--dim)}
.tile.alert b{color:var(--warn)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:600;border-bottom:2px solid var(--line);padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:2px;border:1.5px solid currentColor;white-space:nowrap}
.pill.low{color:var(--warn)}.pill.out{color:var(--bad)}.pill.ok{color:var(--dim)}.pill.ph{color:var(--warn);border-style:dashed}
.sw{display:inline-block;width:14px;height:14px;border:1px solid var(--line);vertical-align:-2px;margin-right:6px;border-radius:2px}
.loc{font-weight:700;color:var(--lime);white-space:nowrap}
.locs{display:flex;gap:4px 10px;flex-wrap:wrap}
.search{display:flex;gap:8px}
.search input{flex:1;font-size:1.2rem;padding:12px 14px;border-color:var(--lime)}
.result{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;justify-content:space-between;align-items:start;flex-wrap:wrap}
.result:first-child{border-top:0}
.result .what{min-width:0;flex:1 1 260px}
.result .what b{font-size:1.05rem}
.big{font-size:1.35rem;font-weight:700}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.acts button{min-height:64px;line-height:1.15;border-color:var(--line)}
.acts button small{display:block;font-weight:500;font-size:.75rem;color:var(--dim)}
.acts button[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--onlime)}
.acts button[aria-pressed="true"] small{color:var(--onlime)}
.form{display:flex;flex-direction:column;gap:10px}
.hint{font-size:.85rem;color:var(--dim);min-height:1.2em}
.err{color:var(--bad);font-weight:600}
.feed{list-style:none;margin:0;padding:0}
.feed li{border-top:1px solid var(--line);padding:7px 0;display:flex;gap:8px;justify-content:space-between;align-items:baseline;flex-wrap:wrap;font-size:.9rem}
.feed li:first-child{border-top:0}
.feed .t{color:var(--dim);font-size:.78rem;white-space:nowrap}
.tag{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:2px;background:var(--panel2);color:var(--ink);margin-right:4px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr) 48px;gap:8px;align-items:center;font-size:.9rem}
.bar .track{height:18px;position:relative}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--lime);border-radius:0 4px 4px 0;min-width:3px}
.bar .v{text-align:right;font-weight:700}
.empty{color:var(--dim);padding:14px 0;text-align:center}
#map{overflow-x:auto}
#map svg{display:block;width:100%;min-width:760px;height:auto}
#map svg text{font-family:var(--font)}
.hit{cursor:pointer}
.hit:hover .cell{stroke:var(--sel);stroke-width:2}
.hit.on .cell{stroke:var(--sel);stroke-width:4}
.zone-o{fill:none;stroke:var(--dim);stroke-dasharray:6 5;stroke-width:1.2}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.8rem;color:var(--dim);margin-top:8px}
.bins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.bin{border:1.5px solid var(--line);padding:4px;font-size:.75rem;text-align:center;min-width:0;overflow-wrap:anywhere}
.bin.full2{grid-column:span 2}
.bin.has{border-color:var(--lime);background:var(--panel2)}
.bin.on{outline:3px solid var(--sel)}
.lvl{display:grid;grid-template-columns:56px minmax(0,1fr);gap:6px;align-items:center;margin-top:4px}
.lvl b{font-size:.8rem;color:var(--lime)}
textarea{width:100%;min-height:140px;font-size:.8rem;font-family:ui-monospace,Menlo,Consolas,monospace}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--lime);color:var(--onlime);font-weight:700;padding:10px 16px;border-radius:3px;z-index:20;max-width:calc(100% - 32px)}
.confirm{border:2px solid var(--bad);padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details summary{cursor:pointer;font-weight:700;padding-block:4px}
a{color:var(--lime)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,10px);opacity:0}}}
</style>

<header><div class="wrap">
 <div class="hrow">
  <div class="brand"><span class="f">FORCE</span> SHOP INVENTORY<small>Boards · hardware · handles · cabinet pallets · misc</small></div>
  <label class="who" for="who">Your name <input id="who" placeholder="e.g. Tony" autocomplete="name"></label>
 </div>
 <nav class="tabs" id="tabs" aria-label="Sections">
  <a href="#find">Find</a><a href="#map">Map</a><a href="#log">Log activity</a><a href="#report">Daily report</a><a href="#items">Items</a><a href="#spots">Locations</a><a href="#backup">Backup</a>
 </nav>
</div></header>

<main class="wrap">
 <div id="banner"></div>
 <section id="v-find" hidden></section>
 <section id="v-map" hidden></section>
 <section id="v-log" hidden></section>
 <section id="v-report" hidden></section>
 <section id="v-items" hidden></section>
 <section id="v-spots" hidden></section>
 <section id="v-backup" hidden></section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";
/* ---------- constants ---------- */
const KEY='force-inv-v1', WHO='force-inv-who', RACKMAP='https://claude.ai/artifact/6H58N7DEKwMkfmE9jZDW1d';
const END=18, AISLES={A:1,B:5,C:5}; // first rack number per aisle, matches the Gilbert rack map
const CATS={board:'Boards',hardware:'Hardware',handle:'Handles',pallet:'Cabinet pallets',misc:'Misc'};
const ZONES=[
 {id:'rackA',name:'Aisle A racks',kind:'rack',a:'A'},{id:'rackB',name:'Aisle B racks',kind:'rack',a:'B'},{id:'rackC',name:'Aisle C racks',kind:'rack',a:'C'},
 {id:'bunks',name:'Board bunks',box:{x:340,y:70,w:300,h:220,cols:8}},
 {id:'saw',name:'Saw & CNC staging',box:{x:340,y:340,w:300,h:70,cols:3}},
 {id:'offcut',name:'Offcut rack',box:{x:340,y:450,w:300,h:56,cols:4}},
 {id:'dock',name:'Receiving dock',box:{x:340,y:548,w:300,h:62,cols:2}},
 {id:'hw',name:'Hardware cage',box:{x:680,y:70,w:290,h:200,cols:4}},
 {id:'handles',name:'Handle wall',box:{x:680,y:310,w:290,h:96,cols:6}},
 {id:'misc',name:'Misc floor',box:{x:680,y:446,w:290,h:164,cols:4}}
];
const ACTIONS={
 receive:{name:'Receive',sub:'new stock in',cats:null,from:false,to:true},
 move:{name:'Move',sub:'spot to spot',cats:null,from:true,to:true},
 cut:{name:'Cut sheets',sub:'boards used today',cats:['board'],from:true,to:false,job:true},
 pull:{name:'Pull for job',sub:'hardware, handles, misc',cats:['hardware','handle','misc'],from:true,to:false,job:true},
 count:{name:'Count',sub:'fix a quantity',cats:null,from:false,to:false,at:true}
};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const tm=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const dt=t=>new Date(t).toLocaleDateString([],{month:'short',day:'numeric'})+' '+tm(t);
const fmt=n=>Number(n).toLocaleString();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sget=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const sset=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}};
function lum(hex){const n=parseInt(hex.slice(1),16),c=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
const textOn=hex=>lum(hex)>.25?'#111':'#fff';

/* ---------- rack locations (generated, fixed) ---------- */
function rackBins(a,r){const out=[];for(let L=1;L<=4;L++)(L===4?['a+b','c+d']:['a','b','c','d']).forEach(b=>out.push(`${a}-${L}${r}-${b}`));return out}
const RACK_IDS=[];Object.keys(AISLES).forEach(a=>{for(let r=AISLES[a];r<=END;r++)RACK_IDS.push(...rackBins(a,r))});
function parseRack(s){const m=String(s).trim().toUpperCase().replace(/\s/g,'').match(/^([ABC])-?([1-4])(\d{1,2})-?(A\+B|C\+D|[ABCD])$/);if(!m)return null;
 const a=m[1],L=+m[2],r=+m[3];let b=m[4].toLowerCase();if(r<AISLES[a]||r>END)return null;
 if(L===4&&b.length===1)b='ab'.includes(b)?'a+b':'c+d';if(L<4&&b.length>1)return null;return{a,L,r,b,id:`${a}-${L}${r}-${b}`}}

/* ---------- state ---------- */
let S=null, saveOK=true;
function save(){saveOK=sset(KEY,JSON.stringify(S));banner()}
function load(){const raw=sget(KEY);if(raw){try{S=JSON.parse(raw);if(S&&S.v===1)return}catch(e){}}S=sample();save()}
const item=sku=>S.items.find(i=>i.sku===sku);
const spot=id=>S.spots.find(l=>l.id===id);
function normLoc(s){s=String(s||'').trim();if(!s)return null;const r=parseRack(s);if(r)return r.id;const u=s.toUpperCase();const l=S.spots.find(x=>x.id.toUpperCase()===u);return l?l.id:null}
function zoneOf(id){const r=parseRack(id);if(r)return 'rack'+r.a;const l=spot(id);return l?l.zone:null}
const zone=id=>ZONES.find(z=>z.id===id);
const qtyAt=(sku,loc)=>(S.stock[sku]||{})[loc]||0;
const total=sku=>Object.values(S.stock[sku]||{}).reduce((a,b)=>a+b,0);
const locsOf=sku=>Object.entries(S.stock[sku]||{}).filter(([,q])=>q>0).sort((a,b)=>b[1]-a[1]);
function contents(loc){const out=[];for(const sku in S.stock){const q=S.stock[sku][loc];if(q>0)out.push([sku,q])}return out.sort((a,b)=>b[1]-a[1])}
function addQty(sku,loc,q){const m=S.stock[sku]??={};m[loc]=(m[loc]||0)+q;if(m[loc]<=0)delete m[loc]}
function status(i){const t=total(i.sku);if(i.cat==='pallet')return t?'':'out';if(t<=0)return 'out';if(i.min&&t<=i.min)return 'low';return ''}
const itemLabel=i=>i?`${i.name}`:'(deleted item)';
const unit=(i,q)=>{if(!i)return '';const u=i.unit||'pcs';return q===1?u.replace(/s$/,''):u};

/* ---------- sample data in placeholder spots ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sample(){
 const spots=[];const add=(zone,ids,desc)=>ids.forEach(id=>spots.push({id,zone,desc:desc||'',ph:true}));
 const seq=(p,n,w=2)=>Array.from({length:n},(_,i)=>p+String(i+1).padStart(w,'0'));
 add('bunks',seq('BK-',16),'Board bunk');
 add('saw',['SAW-1','CNC-1','CNC-2'],'Staging at machine');
 add('offcut',seq('OC-',4,1),'Offcut cart');
 add('dock',['DOCK-IN','DOCK-OUT'],'Dock floor');
 const hw=[];for(let s=1;s<=4;s++)for(const l of 'ABCDE')hw.push(`HW-${s}${l}`);add('hw',hw,'Cage shelf');
 add('handles',seq('HD-',12),'Handle bin');
 add('misc',seq('FLR-',8),'Floor spot');
 const items=[
  {sku:'B-WHT-34',cat:'board',name:'White melamine 3/4"',color:'White',swatch:'#F1F1EC',spec:'49 x 97',unit:'sheets',min:60},
  {sku:'B-WHT-14',cat:'board',name:'White melamine 1/4" (backs)',color:'White',swatch:'#E9E9E2',spec:'49 x 97',unit:'sheets',min:30},
  {sku:'B-GRY-34',cat:'board',name:'Gray oak melamine 3/4"',color:'Gray oak',swatch:'#8E8A82',spec:'49 x 97',unit:'sheets',min:25},
  {sku:'B-BLK-34',cat:'board',name:'Black matte melamine 3/4"',color:'Black matte',swatch:'#232323',spec:'49 x 97',unit:'sheets',min:20},
  {sku:'B-MAP-34',cat:'board',name:'Natural maple plywood 3/4"',color:'Natural maple',swatch:'#D9B98A',spec:'48 x 96',unit:'sheets',min:15},
  {sku:'B-WAL-34',cat:'board',name:'Walnut melamine 3/4"',color:'Walnut',swatch:'#6B4630',spec:'49 x 97',unit:'sheets',min:15},
  {sku:'B-ESP-34',cat:'board',name:'Espresso melamine 3/4"',color:'Espresso',swatch:'#3B2A22',spec:'49 x 97',unit:'sheets',min:15},
  {sku:'B-ALM-34',cat:'board',name:'Almond melamine 3/4"',color:'Almond',swatch:'#E6D9C2',spec:'49 x 97',unit:'sheets',min:10},
  {sku:'H-HNG-110',cat:'hardware',name:'Soft-close hinge 110° full overlay',spec:'Clip-on',unit:'pcs',min:400},
  {sku:'H-HNG-170',cat:'hardware',name:'Soft-close hinge 170° corner',spec:'Clip-on',unit:'pcs',min:60},
  {sku:'H-PLT-0',cat:'hardware',name:'Hinge mounting plate 0 mm',spec:'',unit:'pcs',min:400},
  {sku:'H-SLD-21',cat:'hardware',name:'Undermount drawer slide 21"',spec:'Soft-close',unit:'pairs',min:80},
  {sku:'H-SLD-18',cat:'hardware',name:'Undermount drawer slide 18"',spec:'Soft-close',unit:'pairs',min:40},
  {sku:'H-PIN-5',cat:'hardware',name:'Shelf pins 5 mm',spec:'Box of 100',unit:'boxes',min:10},
  {sku:'H-LEG-4',cat:'hardware',name:'Leg leveler 4"',spec:'',unit:'pcs',min:200},
  {sku:'H-SCR-CF',cat:'hardware',name:'Confirmat screws 7 x 50',spec:'Box of 500',unit:'boxes',min:8},
  {sku:'P-BAR5-BLK',cat:'handle',name:'Bar pull 5" matte black',style:'Bar pull',finish:'Matte black',spec:'5" (128 mm CC)',unit:'pcs',min:150},
  {sku:'P-BAR5-BN',cat:'handle',name:'Bar pull 5" brushed nickel',style:'Bar pull',finish:'Brushed nickel',spec:'5" (128 mm CC)',unit:'pcs',min:150},
  {sku:'P-BAR8-BLK',cat:'handle',name:'Bar pull 8" matte black',style:'Bar pull',finish:'Matte black',spec:'8" (192 mm CC)',unit:'pcs',min:60},
  {sku:'P-CUP3-BLK',cat:'handle',name:'Cup pull 3" matte black',style:'Cup pull',finish:'Matte black',spec:'3" CC',unit:'pcs',min:40},
  {sku:'P-EDGE4-BRS',cat:'handle',name:'Edge pull 4" satin brass',style:'Edge pull',finish:'Satin brass',spec:'4"',unit:'pcs',min:40},
  {sku:'P-KNOB-BLK',cat:'handle',name:'Knob 1-1/4" matte black',style:'Knob',finish:'Matte black',spec:'1-1/4"',unit:'pcs',min:80},
  {sku:'P-KNOB-BN',cat:'handle',name:'Knob 1-1/4" brushed nickel',style:'Knob',finish:'Brushed nickel',spec:'1-1/4"',unit:'pcs',min:80},
  {sku:'M-EB-WHT',cat:'misc',name:'Edge banding white 7/8"',spec:'Roll',unit:'rolls',min:6},
  {sku:'M-EB-GRY',cat:'misc',name:'Edge banding gray oak 7/8"',spec:'Roll',unit:'rolls',min:3},
  {sku:'M-TK-8',cat:'misc',name:'Toe kick 8 ft white',spec:'',unit:'pcs',min:20},
  {sku:'M-CRN-8',cat:'misc',name:'Crown molding 8 ft white',spec:'',unit:'pcs',min:10},
  {sku:'M-GLUE',cat:'misc',name:'Hot melt edgebander glue',spec:'Bag',unit:'bags',min:4},

function apply(e,sign=1){const q=e.qty*sign;
 if(e.type==='receive')addQty(e.sku,e.to,q);
 else if(e.type==='move'){addQty(e.sku,e.from,-q);addQty(e.sku,e.to,q)}
 else if(e.type==='cut'||e.type==='pull')addQty(e.sku,e.from,-q);
 else if(e.type==='count'){const m=S.stock[e.sku]??={};const v=sign>0?e.qty:e.prev;if(v>0)m[e.at]=v;else delete m[e.at]}}
function describe(e){const i=item(e.sku),u=unit(i,e.qty),n=esc(itemLabel(i));
 switch(e.type){
  case 'receive':return `<span class="tag">In</span>${fmt(e.qty)} ${u} ${n} → <span class="loc">${esc(e.to)}</span>`;
  case 'move':return `<span class="tag">Move</span>${fmt(e.qty)} ${u} ${n} <span class="loc">${esc(e.from)}</span> → <span class="loc">${esc(e.to)}</span>`;
  case 'cut':return `<span class="tag">Cut</span>${fmt(e.qty)} ${u} ${n} from <span class="loc">${esc(e.from)}</span>${e.job?' · job '+esc(e.job):''}`;
  case 'pull':return `<span class="tag">Pull</span>${fmt(e.qty)} ${u} ${n} from <span class="loc">${esc(e.from)}</span>${e.job?' · job '+esc(e.job):''}`;
  case 'count':{const d=e.qty-e.prev;return `<span class="tag">Count</span>${n} at <span class="loc">${esc(e.at)}</span>: ${fmt(e.prev)} → ${fmt(e.qty)} (${d>=0?'+':''}${fmt(d)})`}
 }return ''}

function keepForm(){const v=id=>{const i=document.getElementById(id);return i?i.value:undefined};

 if(!i){h.textContent='';return}
 if(act==='count'){const l=normLoc(form.at);h.textContent=l?`System shows ${fmt(qtyAt(i.sku,l))} ${i.unit} at ${l}.`:`${i.name}: ${fmt(total(i.sku))} ${i.unit} total.`;return}

function submit(ev){ev.preventDefault();keepForm();const A=ACTIONS[act],i=item(form.sku),q=Math.floor(+form.qty);

 if(A.to){const to=normLoc(form.to);if(!to)return fail(`“${form.to||''}” isn't a known spot. Use a rack bin like A-15-c, or add the spot under Locations.`);if(to===e.from)return fail('From and to are the same spot.');e.to=to}

 {const d=document.createElement('div');d.innerHTML=describe(e).replace(/<\/span>/,' </span>');toast('Logged: '+d.textContent)}

let repDay=ymd(Date.now());

 const el=$('#v-report'),L=S.log.filter(e=>ymd(e.t)===repDay);
 const sum=(type,cat,key)=>{const m=new Map();L.forEach(e=>{if(e.type!==type)return;const i=item(e.sku);if(!i||(cat&&i.cat!==cat))return;const k=key(i);const o=m.get(k)||{k,q:0,i,jobs:new Set()};o.q+=e.qty;if(e.job)o.jobs.add(e.job);m.set(k,o)});return[...m.values()].sort((a,b)=>b.q-a.q)};

 const table=(rows)=>rows.length?`<div class="tbl"><table><thead><tr><th>Item</th><th class="n">Qty</th><th>Jobs</th><th class="n">Left</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.i.name)}</td><td class="n"><b>${fmt(r.q)}</b> <span class="dim small">${esc(r.i.unit)}</span></td><td class="small">${[...r.jobs].map(esc).join(', ')||'<span class="dim">none</span>'}</td><td class="n">${fmt(total(r.i.sku))}${status(r.i)?` <span class="pill ${status(r.i)}">${status(r.i)==='low'?'Low':'Out'}</span>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">None logged.</p>';
 const isToday=repDay===ymd(Date.now());
 el.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><div><h1>${isToday?'End of day':'Day report'}: ${new Date(repDay+'T12:00').toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}</h1><p class="dim small">${L.length} entries logged${L.some(e=>e.ex)?' · includes sample entries':''}</p></div>
  <div class="row"><label for="rd">Day<input id="rd" type="date" value="${repDay}"></label><button id="cp">Copy report text</button></div></div>
  <div class="tiles"><div class="tile"><span>Sheets cut</span><b>${fmt(totalCut)}</b><em>${cutColor.length} colors</em></div>
   <div class="tile"><span>Hardware pulled</span><b>${fmt(hw.reduce((a,o)=>a+o.q,0))}</b><em>${hw.length} items</em></div>
   <div class="tile"><span>Handles pulled</span><b>${fmt(hd.reduce((a,o)=>a+o.q,0))}</b><em>${hd.length} kinds</em></div>

   <div class="tile ${cnt.length?'alert':''}"><span>Count fixes</span><b>${cnt.length}</b><em>spots corrected</em></div></div>
  <div class="grid2">
   <div class="card"><h2>Sheets cut by color</h2>${bars(cutColor,true)}
    ${cutBoard.length>cutColor.length?`<details style="margin-top:8px"><summary>By board and thickness</summary>${bars(cutBoard.map(r=>({...r,k:r.i.name})),true)}</details>`:''}</div>
   <div class="card"><h2>Handles by style and finish</h2>${bars(hdStyle,false)}</div>

   ${misc.length?`<div class="card"><h2>Misc pulled</h2>${table(misc)}</div>`:''}
   <div class="card"><h2>Received, moved, counted</h2>${rec.length+mov.length+cnt.length?`<ul class="feed">${[...rec,...mov,...cnt].map(e=>`<li><span>${describe(e)}</span><span class="t">${tm(e.t)} · ${esc(e.who||'')}</span></li>`).join('')}</ul>`:'<p class="empty">None logged.</p>'}</div>
   <div class="card"><h2>Who logged</h2>${ppl.size?`<ul class="feed">${[...ppl].map(([p,n])=>`<li><span>${esc(p)}</span><b>${n} entries</b></li>`).join('')}</ul>`:'<p class="empty">No one yet.</p>'}</div>
  </div><textarea id="rt" aria-label="Report text" hidden readonly></textarea>`;
 $('#rd').onchange=e=>{repDay=e.target.value||ymd(Date.now());rReport()};
 $('#cp').onclick=()=>{const lines=[`FORCE SHOP INVENTORY: ${repDay}`,'',`Sheets cut: ${totalCut}`,...cutColor.map(r=>`  ${r.k}: ${r.q}`),'',`Hardware pulled:`,...hw.map(r=>`  ${r.i.name}: ${r.q} ${r.i.unit}${r.jobs.size?' (jobs '+[...r.jobs].join(', ')+')':''}`),'',`Handles pulled:`,...hd.map(r=>`  ${r.i.name}: ${r.q}`),...(misc.length?['','Misc pulled:',...misc.map(r=>`  ${r.i.name}: ${r.q} ${r.i.unit}`)]:[]),'',`Received: ${rec.length} · Moves: ${mov.length} · Count fixes: ${cnt.length}`];
  copyText(lines.join('\n'),$('#rt'))};

  <div class="card stack"><h2>Save a backup</h2><div class="row"><button id="b-copy">Copy backup</button><button class="ghost" id="b-dl">Download .json</button><button class="ghost" id="b-csv">Copy stock as CSV</button></div>
   <p class="dim small">Download works when this file is opened straight from a computer. Inside the Claude app, use Copy instead.</p><textarea id="b-out" readonly hidden aria-label="Backup text"></textarea></div>
  <div class="card stack"><h2>Restore a backup</h2><label for="b-in">Paste backup text<textarea id="b-in" placeholder='{"v":1, ...}'></textarea></label>
   <div class="row"><label for="b-file">Or open a .json file<input id="b-file" type="file" accept=".json,application/json"></label><button class="go" id="b-load">Restore</button></div><div class="hint" id="b-msg"></div></div>
  <div class="card stack"><h2>Start fresh</h2><p class="small">Clears all items, stock and history but keeps the location list, so you can enter real counts. Do this once the spots match the floor.</p>
   <div class="row"><button class="danger" id="b-fresh">Start fresh</button><button class="ghost" id="b-sample">Reload sample data</button></div><div id="b-conf"></div></div>
  <div class="card"><h2>What's stored</h2><ul class="feed"><li><span>Items</span><b>${S.items.length}</b></li><li><span>Locations</span><b>${S.spots.length+RACK_IDS.length}</b></li><li><span>Log entries</span><b>${S.log.length}</b></li><li><span>Saving on this device</span><b>${saveOK?'Yes':'No'}</b></li></ul></div>
 </div>`;
 const json=()=>JSON.stringify(S);
 $('#b-copy').onclick=()=>copyText(json(),$('#b-out'));
 $('#b-dl').onclick=()=>download(`force-inventory-${ymd(Date.now())}.json`,json(),'application/json');
 $('#b-csv').onclick=()=>copyText(csv(),$('#b-out'));
 $('#b-file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>$('#b-in').value=r.result;r.readAsText(f)};
 $('#b-load').onclick=()=>{try{const d=JSON.parse($('#b-in').value);if(!d||d.v!==1||!Array.isArray(d.items)||!d.stock)throw 0;S=d;save();toast('Backup restored');go('find')}catch(e){$('#b-msg').innerHTML='<span class="err">That text is not a Force inventory backup. Paste the whole thing, starting with {"v":1.</span>'}};
 const ask=(kind,msg,fn)=>{$('#b-conf').innerHTML=`<div class="confirm" style="margin-top:8px"><span>${msg}</span><button class="danger sm" id="b-yes">Yes, ${kind}</button><button class="ghost sm" id="b-no">Cancel</button></div>`;$('#b-yes').onclick=fn;$('#b-no').onclick=()=>$('#b-conf').innerHTML=''};
 $('#b-fresh').onclick=()=>ask('clear it','This erases every item, quantity and log entry on this device. Copy a backup first if you might want it.',()=>{S={v:1,sample:false,created:new Date().toISOString(),spots:S.spots.map(l=>({...l})),items:[],stock:{},log:[]};save();toast('Cleared. Add your items next.');go('items')});
 $('#b-sample').onclick=()=>ask('reload','This replaces everything on this device with the sample data.',()=>{S=sample();save();toast('Sample data loaded');go('find')});
}

/* ---------- boot ---------- */
load();banner();route();
</script>

<title>Force Gilbert Inventory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iOS-style app. Blurred nav bar + large titles, inset grouped lists, bottom tab bar, bottom sheets for every quick action. */
:root{
 --bg:#F2F2F7;--cell:#FFFFFF;--fill:#E9E9EE;--ink:#000000;--ink2:#6C6C70;--sep:#D1D1D6;
 --tint:#2F7A0F;--tintbg:rgba(47,122,15,.12);--ontint:#FFFFFF;
 --orange:#B85C00;--red:#D70015;--blue:#0062CC;--purple:#9A33A8;--yellow:#FFD60A;
 --bar:rgba(249,249,249,.86);--sbg:#F2F2F7;--scell:#FFFFFF;--sfill:#E3E3E8;--scrim:rgba(0,0,0,.32);--shadow:0 8px 30px rgba(0,0,0,.12);
 --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
 --round:-apple-system-rounded,ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
 color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--cell:#1C1C1E;--fill:#2C2C2E;--ink:#FFFFFF;--ink2:#98989F;--sep:#38383A;--tint:#8DC63F;--tintbg:rgba(141,198,63,.18);--ontint:#0B1206;--orange:#FF9F0A;--red:#FF453A;--blue:#0A84FF;--purple:#BF5AF2;--bar:rgba(22,22,24,.86);--sbg:#1C1C1E;--scell:#2C2C2E;--sfill:#3A3A3C;--scrim:rgba(0,0,0,.55);--shadow:0 8px 30px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--cell:#1C1C1E;--fill:#2C2C2E;--ink:#FFFFFF;--ink2:#98989F;--sep:#38383A;--tint:#8DC63F;--tintbg:rgba(141,198,63,.18);--ontint:#0B1206;--orange:#FF9F0A;--red:#FF453A;--blue:#0A84FF;--purple:#BF5AF2;--bar:rgba(22,22,24,.86);--sbg:#1C1C1E;--scell:#2C2C2E;--sfill:#3A3A3C;--scrim:rgba(0,0,0,.55);--shadow:0 8px 30px rgba(0,0,0,.5);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.35 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.sub{color:var(--ink2)}.fn{font-size:13px}.cap{font-size:15px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--tint)}

/* nav bar */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:52px;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.nb{width:44px;height:44px;border:0;background:none;color:var(--tint);display:grid;place-items:center;border-radius:22px;justify-self:center}
.nb:active{background:var(--fill)}
.nt{text-align:center;font-weight:600;font-size:17px;opacity:0;transition:opacity .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav.scrolled .nt{opacity:1}
.lt{font:700 34px/1.15 var(--font);letter-spacing:-.02em;margin:6px 0 2px}
.lsub{color:var(--ink2);font-size:15px;display:flex;align-items:center;gap:6px}
.live{width:8px;height:8px;border-radius:50%;background:var(--ink2);display:inline-block}.live.on{background:#34C759}
main{padding-top:8px;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:22px}
.st{display:flex;flex-direction:column;gap:8px}
.hd{font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:var(--ink2);margin:0 16px}
.ft{font-size:13px;color:var(--ink2);margin:0 16px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;min-height:52px;text-decoration:none;color:var(--ink2);font-size:10.5px;font-weight:500;position:relative}
.tab svg.i{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--tint)}
.tab .bd{position:absolute;top:3px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

/* dropdown menu */
#menu{position:fixed;z-index:42;top:calc(env(safe-area-inset-top,0px) + 54px);left:max(8px,env(safe-area-inset-left,0px));width:min(320px,calc(100vw - 16px));max-height:calc(100dvh - 140px);overflow:auto;background:var(--cell);border-radius:14px;box-shadow:var(--shadow);padding:6px 0}
#menuScrim{position:fixed;inset:0;z-index:41;background:transparent}
@media (prefers-reduced-motion:no-preference){#menu{animation:pop .16s ease-out;transform-origin:top left}@keyframes pop{from{opacity:0;transform:scale(.94)}}}
.mh{font-size:13px;color:var(--ink2);padding:10px 16px 4px}
.mi{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 16px;border:0;background:none;text-decoration:none;color:var(--ink);font-size:17px;text-align:left}
.mi svg.i{color:var(--tint)}
.mi:active{background:var(--fill)}
.msep{height:.5px;background:var(--sep);margin:6px 0}

/* grouped list */
.group{background:var(--cell);border-radius:12px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 16px;width:100%;border:0;background:none;text-align:left;text-decoration:none;color:var(--ink);position:relative}
.cell+.cell::before,.cell+details::before,details+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
button.cell:active,a.cell:active{background:var(--fill)}
.cell .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cell .tx b{font-weight:400;overflow-wrap:anywhere}
.cell .tx .t2{color:var(--ink2);font-size:15px;overflow-wrap:anywhere}
.cell .val{color:var(--ink2);text-align:right;white-space:nowrap}
.cell .val.strong{color:var(--ink);font-weight:600}
.chev{color:var(--sep);display:flex}.chev svg.i{width:18px;height:18px;stroke-width:2.5}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.ico svg.i{width:18px;height:18px}
.code{font:600 17px var(--round);color:var(--tint)}
.empty{padding:28px 16px;text-align:center;color:var(--ink2)}
.dotst{width:10px;height:10px;border-radius:50%;flex:none}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;border:0;background:var(--tint);color:var(--ontint);font-weight:600;font-size:17px;text-decoration:none;width:100%}
.btn:active{opacity:.75}
.btn.gray{background:var(--fill);color:var(--tint)}
.btn.plain{background:none;color:var(--tint)}
.btn.red{background:var(--fill);color:var(--red)}
.btn:disabled{opacity:.4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:18px;border:0;background:var(--fill);color:var(--tint);font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap}
.pills{display:flex;gap:8px;flex-wrap:wrap}

/* home */
.search{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 12px;border-radius:12px;border:0;background:var(--fill);color:var(--ink2);font-size:17px;text-align:left}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:118px;padding:14px;border-radius:16px;border:0;background:var(--cell);color:var(--ink);text-decoration:none;text-align:left}
.tile:active{transform:scale(.98)}
.tile .ico{width:40px;height:40px;border-radius:11px}
.tile .ico svg.i{width:22px;height:22px}
.tile b{font-size:17px;font-weight:600;margin-top:auto}
.tile .n{position:absolute;top:14px;right:14px;font:700 22px var(--round);color:var(--ink)}
.tile .n small{font-size:13px;color:var(--ink2);font-weight:500}

/* segmented control */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;min-height:34px;font-size:14px;font-weight:600;color:var(--ink);padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--cell);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.seg button small{color:var(--ink2);font-weight:500;margin-left:3px}

/* forms */
.field{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 16px;position:relative}
.field+.field::before,.field+.cell::before,.cell+.field::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.field>span{flex:none;min-width:92px}
.field input,.field select{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;text-align:right;min-height:40px;padding:0;-webkit-appearance:none;appearance:none}
.field select{color:var(--tint)}
.field input::placeholder{color:var(--ink2)}
.field input:focus,.field select:focus{outline:none}
textarea{width:100%;min-height:140px;border:0;border-radius:12px;background:var(--cell);color:var(--ink);font:15px ui-monospace,Menlo,monospace;padding:12px}
input[type="file"]{font-size:15px}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;pointer-events:none;border-radius:16px;background:var(--fill);transition:background .2s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+i{background:#34C759}.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{outline:3px solid var(--blue);outline-offset:2px}

/* quantity stepper */
.qp{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center}
.stepper button{height:64px;border-radius:16px;border:0;background:var(--fill);color:var(--tint);display:grid;place-items:center}
.stepper button svg.i{width:28px;height:28px;stroke-width:2.5}
.stepper button:active{background:var(--tintbg)}
.stepper input{height:64px;border-radius:16px;border:2px solid var(--fill);background:var(--cell);color:var(--ink);font:700 32px var(--round);text-align:center;width:100%;min-width:0}
.stepper input:focus{outline:none;border-color:var(--tint)}
.qtot{text-align:center;color:var(--ink2);font-size:15px;min-height:20px}
.qtot b{color:var(--ink)}

/* item picker */
.ipick .res{max-height:300px;overflow:auto}

/* sheets */
#sheetWrap{position:fixed;inset:0;z-index:50}
#sheetWrap .scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{--fill:var(--sfill);--cell:var(--scell);position:absolute;left:0;right:0;bottom:0;max-height:calc(100dvh - env(safe-area-inset-top,0px) - 24px);background:var(--sbg);border-radius:14px 14px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);max-width:720px;margin:0 auto}
@media (prefers-reduced-motion:no-preference){.sheet{animation:sup .28s cubic-bezier(.2,.9,.3,1)}@keyframes sup{from{transform:translateY(100%)}}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:6px auto 0;flex:none}
.shead{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;min-height:48px;padding:0 8px;flex:none}
.shead h2{font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead button{border:0;background:none;color:var(--tint);font-size:17px;min-height:44px;padding:0 8px}
.shead .close{justify-self:end;width:30px;height:30px;min-height:0;padding:0;border-radius:50%;background:var(--fill);color:var(--ink2);display:grid;place-items:center}
.shead .close svg.i{width:16px;height:16px;stroke-width:3}
.sbody{overflow:auto;padding:4px max(16px,env(safe-area-inset-left,0px)) 16px max(16px,env(safe-area-inset-right,0px));flex:1;-webkit-overflow-scrolling:touch}
.sfoot{flex:none;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));background:var(--sbg)}
.hero{text-align:center;padding:6px 0 4px}
.hero .big{font:700 44px/1.05 var(--round);letter-spacing:-.01em}
.hero .tot{color:var(--ink2);font-size:17px;margin-top:2px}
.hero .nm{font-weight:600;font-size:19px;margin-top:10px}
.verbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.verb{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:var(--cell);border-radius:14px;padding:12px 4px;color:var(--tint);font-size:13px;font-weight:600}
.verb:active{background:var(--fill)}
.verb .ico{width:44px;height:44px;border-radius:22px;background:var(--tintbg);color:var(--tint)}
.verb .ico svg.i{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--ink2);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%}
details.cell{display:block;padding:0}
details.cell>summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 16px;cursor:pointer}
details.cell>summary::-webkit-details-marker{display:none}
details.cell>summary .chev{transition:transform .15s}
details.cell[open]>summary .chev{transform:rotate(90deg)}
details.cell .dbody{padding:0 16px 14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:0}.kv dt{color:var(--ink2)}.kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.warn{color:var(--orange);font-weight:600}.bad{color:var(--red);font-weight:600}.good{color:var(--tint);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 60px);z-index:60;background:var(--cell);color:var(--ink);box-shadow:var(--shadow);font-weight:600;font-size:15px;padding:12px 18px;border-radius:999px;max-width:calc(100% - 32px);text-align:center;display:flex;gap:8px;align-items:center;pointer-events:none}
.toast svg.i{color:#34C759}
@media (prefers-reduced-motion:no-preference){.toast{animation:tdown .25s ease-out}@keyframes tdown{from{transform:translate(-50%,-12px);opacity:0}}}
.dots{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.dots span{display:flex;align-items:center;gap:6px}
.dots span::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--sep)}
.dots span.on{color:var(--ink)}.dots span.on::before{background:#34C759;border-color:#34C759}
.ring{width:120px;height:120px;margin:0 auto;display:block}
.photo{max-width:140px;border-radius:10px;display:block}
.banner{background:var(--cell);border-radius:12px;padding:12px 16px;font-size:15px;display:flex;gap:10px;align-items:center}
.banner b{color:var(--orange)}
.bars{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.bar{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;font-size:15px}
.bar .tr{height:10px;background:var(--fill);border-radius:5px;overflow:hidden}.bar .tr i{display:block;height:100%;background:var(--tint);border-radius:5px}
.bar b{text-align:right;font-weight:600}
.statg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--cell);border-radius:14px;padding:14px}
.stat b{display:block;font:700 28px var(--round)}
.stat span{color:var(--ink2);font-size:13px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:.5px solid var(--sep);margin-right:6px;vertical-align:-1px}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.label{border:2px solid #111;background:#fff;color:#111;padding:10px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:center;border-radius:8px}
.label svg{width:76px;height:76px;display:block}
.label .c{font:700 22px var(--round);line-height:1}
.label .s{font-size:12px;margin-top:3px}

/* map */
.mapwrap{margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0 calc(-1*max(16px,env(safe-area-inset-right,0px)))}
.zchips{display:flex;gap:8px;overflow-x:auto;padding:4px max(16px,env(safe-area-inset-left,0px)) 10px;scrollbar-width:none}
.zchips::-webkit-scrollbar{display:none}
.zchips button{flex:none;min-height:36px;padding:0 14px;border-radius:18px;border:0;background:var(--cell);color:var(--ink);font-weight:600;font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.zchips button[aria-pressed="true"]{background:var(--tint);color:var(--ontint)}
#stage{position:relative;height:calc(100svh - 230px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:380px;background:#D9DEDB;overflow:hidden;touch-action:none}
@media (min-width:721px){#stage{border-radius:16px;margin:0 16px}}
#stage canvas{display:block}
.stagemsg{padding:20px;color:#333}
.olay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.olay .lb{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;font:600 13px var(--font);padding:6px 11px;border-radius:14px;border:0;min-height:30px;background:rgba(255,255,255,.94);color:#111;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.olay .lb.area{background:rgba(255,255,255,.6);color:#333;pointer-events:none;font-size:11px;letter-spacing:.06em;box-shadow:none;min-height:0}
.olay .lb.bay{background:rgba(17,17,17,.78);color:#fff;font-size:12px;min-height:26px}
.olay .lb.other{background:rgba(255,255,255,.7);font-size:12px;min-height:26px}
.fab{position:absolute;right:12px;display:flex;flex-direction:column;gap:8px;top:12px}
.fab button{width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.94);color:#111;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.fab button[aria-pressed="true"]{background:#2F7A0F;color:#fff}
.mapbar{position:absolute;left:12px;right:68px;bottom:12px;display:flex;gap:8px;align-items:center}
.mapbar .mb{min-height:44px;padding:0 14px;border-radius:22px;border:0;background:rgba(255,255,255,.94);color:#111;font-weight:600;font-size:15px;box-shadow:0 2px 10px rgba(0,0,0,.18);display:flex;align-items:center;gap:6px;white-space:nowrap}
.maphint{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;background:rgba(17,17,17,.72);color:#fff;font-size:14px;padding:8px 14px;border-radius:16px;pointer-events:none;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);padding:10px 16px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.elev{display:flex;flex-direction:column;gap:14px}
.bayh{display:flex;justify-content:space-between;align-items:center;margin:0 4px 6px;font-size:15px;font-weight:600}
.lvrow{display:grid;gap:5px;margin-bottom:5px}
.sp{min-height:50px;padding:4px;border:0;background:var(--cell);color:var(--ink);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;min-width:0;position:relative}
.sp span{font-weight:500;color:var(--ink2);font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--st,transparent)}

const S={items:{},stock:{},pos:{},outs:{},log:[],meta:{},ready:false};
let DB=null,USER=null,UID=null,ME='',CANWRITE=true,MODE='loading',ASSETS=null,DLS=null;
const PROF={},LKEY='force-wms-v3-local',NKEY='force-inv-who';
function loadLocal(){try{const d=JSON.parse(sget(LKEY)||'null');if(d&&d.v===3)Object.assign(S,d.S)}catch(e){}}
function saveLocal(){sset(LKEY,JSON.stringify({v:3,S:{items:S.items,stock:S.stock,pos:S.pos,outs:S.outs,log:S.log.slice(0,2000),meta:S.meta}}))}
function applyLocal(col,id,data){
 if(col==='items'){for(const k in S.items)if(S.items[k]._id===id)delete S.items[k];if(data)S.items[data.sku]={...data,_id:id}}
 else if(col==='stock'){if(data)S.stock[id]=data;else delete S.stock[id]}
 else if(col==='pos'||col==='outs'){if(data)S[col][id]={...data,id};else delete S[col][id]}
 else if(col==='log'){S.log=S.log.filter(e=>e.id!==id);if(data){S.log.unshift({...data,id});S.log.sort((a,b)=>a.t<b.t?1:-1)}}
 else if(col==='meta')S.meta=data||{}}
const W={
 async set(col,id,data){if(!CANWRITE)throw new Error('read-only');applyLocal(col,id,data);if(DB)await DB.collection(col).doc(id).set(data);else saveLocal();onData()},
 async del(col,id){if(!CANWRITE)throw new Error('read-only');applyLocal(col,id,null);if(DB)await DB.collection(col).doc(id).delete();else saveLocal();onData()}};
async function boot(){
 render();
 let db=null,user=null;
 try{if(window.claude&&claude.use)[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){}
 USER=user;
 if(user){try{UID=await user.id()}catch(e){}try{const m=await user.me();ME=m&&m.name||''}catch(e){}try{if(await user.can('data.write')===false)CANWRITE=false}catch(e){}}
 if(db){DB=db;MODE='live';subscribe();try{claude.use('assets').then(a=>ASSETS=a,()=>{});claude.use('downloads').then(d=>DLS=d,()=>{})}catch(e){}}
 else{MODE='local';loadLocal();S.ready=true;onData()}
}
function subscribe(){
 const err=e=>{if(e&&e.code==='revoked')CANWRITE=false;toast('Live updates paused. Pull to refresh.')};
 const sub=(col,fn)=>DB.collection(col).onSnapshot(s=>{fn(s);S.ready=true;onData()},err);
 sub('items',s=>{S.items={};s.docs.forEach(d=>{const v=d.data();if(v&&v.sku)S.items[v.sku]={...v,_id:d.id}})});
 sub('stock',s=>{S.stock={};s.docs.forEach(d=>S.stock[d.id]=d.data())});
 sub('pos',s=>{S.pos={};s.docs.forEach(d=>S.pos[d.id]={...d.data(),id:d.id})});
 sub('outs',s=>{S.outs={};s.docs.forEach(d=>S.outs[d.id]={...d.data(),id:d.id})});
 DB.collection('log').orderBy('t','desc').limit(600).onSnapshot(s=>{S.log=s.docs.map(d=>({...d.data(),id:d.id}));onData()},err);
 DB.doc('meta/main').onSnapshot(d=>{S.meta=d.exists?d.data():{};onData()},err);
}

function nameOf(id){if(!id)return 'Someone';if(id.startsWith('name:'))return id.slice(5);if(id===UID)return ME||'You';return PROF[id]?.name||'Someone'}
let profT=0;function resolveNames(){if(!USER||!USER.profiles)return;clearTimeout(profT);profT=setTimeout(async()=>{
 const ids=new Set();S.log.slice(0,200).forEach(e=>e.who&&ids.add(e.who));Object.values(S.pos).forEach(p=>[p.createdBy,p.receivedBy,p.paper?.by,p.paper?.cby].forEach(x=>x&&ids.add(x)));Object.values(S.outs).forEach(o=>[o.createdBy,o.doneBy].forEach(x=>x&&ids.add(x)));Object.values(S.stock).forEach(s=>s.by&&ids.add(s.by));
 const need=[...ids].filter(x=>!x.startsWith('name:')&&!PROF[x]);if(!need.length)return;
 try{const ps=await USER.profiles(need);let n=0;for(const k in ps){PROF[k]=ps[k];n++}if(n&&V.live)render()}catch(e){}},400)}
let dataT=0;function onData(){clearTimeout(dataT);dataT=setTimeout(()=>{tabs();refresh3D();resolveNames();if(V.live&&!SH.open)render();if(SH.open&&SH.live)SH.redraw()},60)}

/* ---------- stock math ---------- */
const item=sku=>S.items[sku];
const lines=loc=>(S.stock[loc]&&S.stock[loc].lines)||[];
const sinfo=loc=>S.stock[loc]||{};
const uom=i=>(i&&i.uom)||'pcs';
const plural=n=>/(x|s|ch|sh)$/.test(n)?n+'es':n+'s';
const packOf=i=>i&&i.pack&&i.pack.q>1?i.pack:null;
function fmtQ(i,q){if(q==null)return 'Not counted';const u=uom(i),pk=packOf(i);if(!pk||q<pk.q)return `${fmt(q)} ${u}`;const p=Math.floor(q/pk.q),r=q%pk.q;return `${fmt(p)} ${p===1?pk.n:plural(pk.n)}${r?` + ${fmt(r)}`:''}`}
const fmtTot=(i,q)=>packOf(i)&&q!=null&&q>=packOf(i).q?`${fmt(q)} ${uom(i)}`:'';
function onHand(sku){let n=0,unk=0;const locs=[];for(const loc in S.stock)for(const l of lines(loc))if(l.sku===sku){locs.push([loc,l.qty]);if(l.qty==null)unk++;else n+=l.qty}return{n,unk,locs:locs.sort((a,b)=>(b[1]??-1)-(a[1]??-1))}}
function onOrder(sku){let n=0;Object.values(S.pos).forEach(p=>{if(p.status==='open')(p.lines||[]).forEach(l=>{if(l.sku===sku)n+=l.ordered||0})});return n}
function homeOf(sku){return Object.keys(S.stock).filter(k=>S.stock[k].assign===sku)}
function ruleFor(loc,i){if(!i)return null;const l=LOC[loc];if(!l||!l.geo)return null;const a=sinfo(loc).assign;if(a&&a!==i.sku)return `Set aside for ${item(a)?.name||a}.`;
 const z=zone(l.z);if(z.kind==='bunk')return bunkRule(i,l.bunk,l.side);return z.rule?z.rule(i,l.L):null}
function locStatus(id){const ls=lines(id),m=sinfo(id);
 if(m.recount)return 'recount';if(ls.some(l=>ruleFor(id,item(l.sku))))return 'wrong';
 if(!ls.length)return m.counted?'emptyok':'empty';if(!m.counted||ls.some(l=>l.qty==null))return 'uncounted';return 'ok'}
const STL={ok:'Counted',uncounted:'Not counted',wrong:'Wrong spot',recount:'Recount',empty:'Empty',emptyok:'Checked empty'};
const STC={ok:'#34C759',uncounted:'#FF9F0A',wrong:'#FF3B30',recount:'#AF52DE',empty:'transparent',emptyok:'#8E8E93'};
const chipSt=st=>`<span class="chip"><i style="background:${STC[st]==='transparent'?'var(--sep)':STC[st]}"></i>${STL[st]}</span>`;
function lowState(i){if(!i||!i.min)return '';const o=onHand(i.sku);if(o.unk)return '';const oo=onOrder(i.sku);return o.n<=0&&!oo?'out':o.n+oo<=i.min?'low':''}
const clone=o=>JSON.parse(JSON.stringify(o||{}));
async function change(loc,sku,d){const doc=clone(S.stock[loc]);doc.lines=doc.lines||[];let l=doc.lines.find(x=>x.sku===sku),short=false;
 if(!l){if(d>0)doc.lines.push({sku,qty:d});else short=true}
 else if(l.qty!=null){l.qty+=d;if(l.qty<0){l.qty=0;short=true}if(l.qty===0)doc.lines=doc.lines.filter(x=>x!==l)}
 if(short&&LOC[loc]?.geo)doc.recount=true;await W.set('stock',loc,doc);return short}
async function logIt(e){e.t=new Date().toISOString();e.day=ymd(e.t);e.who=whoId();for(const k in e)if(e[k]===undefined)delete e[k];await W.set('log',uid(),e);return e}
async function saveCount(loc,newLines,reason){const cur=clone(S.stock[loc]),old=cur.lines||[],t=new Date().toISOString();
 const skus=new Set([...old.map(l=>l.sku),...newLines.map(l=>l.sku)]);
 for(const sku of skus){const o=old.find(l=>l.sku===sku),nw=newLines.find(l=>l.sku===sku),prev=o?o.qty:0,now=nw?nw.qty:0;if(prev!==now)await logIt({type:'count',sku,at:loc,prev,qty:now,reason:prev?reason:undefined})}
 cur.lines=newLines.filter(l=>l.qty>0);cur.counted=t;cur.by=whoId();delete cur.recount;await W.set('stock',loc,cur)}
async function guard(fn){if(!CANWRITE){toast('View only. Ask the owner for edit access.',true);return}try{await fn()}catch(e){console.error(e);toast(e&&e.code==='quota_exceeded'?'Storage is full.':'Didn’t save. Check your connection.',true)}}
function suggest(i){const h=homeOf(i.sku).filter(l=>LOC[l]);if(h.length)return{loc:h[0],why:'Its spot'};
 const have=onHand(i.sku).locs.map(x=>x[0]).filter(l=>LOC[l]?.geo&&!ruleFor(l,i));if(have.length)return{loc:have[0],why:'Already here'};
 const PREF={board:['BK','CL1','CL2'],hardware:['D'],fastener:['HR1','HR2'],handle:['R1','HR2'],pallet:['A','B','C'],packaging:['R0'],molding:['R0'],misc:['R0']};
 let cand=PHYS.filter(l=>(PREF[i.cat]||[]).includes(l.z)&&!lines(l.id).length&&!sinfo(l.id).assign&&!ruleFor(l.id,i));
 cand.sort((a,b)=>(PREF[i.cat]||[]).indexOf(a.z)-(PREF[i.cat]||[]).indexOf(b.z));
 if(isCard(i))cand=cand.filter(l=>l.L===4).concat(cand.filter(l=>l.L!==4));if(i.cat==='hardware')cand=cand.filter(l=>l.L===1).concat(cand.filter(l=>l.L!==1));
 return cand[0]?{loc:cand[0].id,why:'Open spot'}:null}

function qtyPick(i,k,val){const pk=packOf(i),u=uom(i),mode=pk?'p':'u';
 const shown=val==null?'':pk?(val%pk.q===0?val/pk.q:val):val,m=pk&&val!=null&&val%pk.q!==0?'u':mode;
 return `<div class="qp" data-qk="${k}" data-pk="${pk?pk.q:1}" data-mode="${m}" data-u="${esc(u)}" data-pn="${pk?esc(plural(pk.n)):''}" data-p1="${pk?esc(pk.n):''}">
  ${pk?`<div class="seg" role="group" aria-label="Count in"><button type="button" data-qm="p" aria-pressed="${m==='p'}">${esc(plural(pk.n)[0].toUpperCase()+plural(pk.n).slice(1))} of ${pk.q}</button><button type="button" data-qm="u" aria-pressed="${m==='u'}">${esc(u[0].toUpperCase()+u.slice(1))}</button></div>`:''}
  <div class="stepper"><button type="button" data-qs="-1" aria-label="Less">${ic('minus')}</button><input type="number" inputmode="numeric" min="0" step="1" value="${shown}" aria-label="Quantity" placeholder="0"><button type="button" data-qs="1" aria-label="More">${ic('plus')}</button></div>
  <p class="qtot" aria-live="polite"></p></div>`}
function readQty(root,k){const q=root.querySelector(`[data-qk="${k}"]`);if(!q)return null;const v=q.querySelector('input').value;if(v==='')return null;const n=+v;if(!Number.isInteger(n)||n<0)return NaN;return q.dataset.mode==='p'?n*+q.dataset.pk:n}
function qtyTotal(q){const v=q.querySelector('input').value,o=q.querySelector('.qtot');if(v===''){o.textContent='';return}const n=+v;
 o.innerHTML=q.dataset.mode==='p'?`<b>${fmt(n)} ${esc(n===1?q.dataset.p1:q.dataset.pn)}</b> = ${fmt(n*+q.dataset.pk)} ${esc(q.dataset.u)}`:`<b>${fmt(n)} ${esc(q.dataset.u)}</b>${+q.dataset.pk>1&&n>=+q.dataset.pk?` = ${fmt(Math.floor(n/+q.dataset.pk))} ${esc(Math.floor(n/+q.dataset.pk)===1?q.dataset.p1:q.dataset.pn)}${n%+q.dataset.pk?` + ${n%+q.dataset.pk}`:''}`:''}`}

function spotSheet(loc){const l=LOC[loc];
 openSheet({title:loc,live:true,body:()=>{const m=sinfo(loc),sl=lines(loc),st=locStatus(loc),as=m.assign&&item(m.assign),iss=sl.map(x=>ruleFor(loc,item(x.sku))).filter(Boolean);

   <p style="margin-top:10px">${chipSt(st)}</p>${iss.map(x=>`<p class="bad cap" style="margin-top:8px">${esc(x)}</p>`).join('')}${m.recount?'<p class="warn cap" style="margin-top:8px">Count this spot again</p>':''}</div>
   <div class="verbs">${verb('add','Add')}${verb('take','Take',!sl.length)}${verb('move','Move',!sl.length)}${verb('count','Count')}</div>
   <div class="group"><details class="cell"><summary><span class="tx"><b>Details</b></span>${chev}</summary><div class="dbody"><dl class="kv"><dt>For</dt><dd>${as?esc(as.name):esc(l.purpose)}</dd><dt>Counted</dt><dd>${m.counted?`${ago(m.counted)} · ${esc(nameOf(m.by))}`:'Never'}</dd></dl></div></details>
   ${route!=='map'?`<button class="cell" id="ssMap">${icoB('map','#007AFF')}<span class="tx"><b>Show in 3D</b></span>${chev}</button>`:''}</div></div>`},
  bind:s=>{const sl=lines(loc),sku=sl[0]?.sku||sinfo(loc).assign;
   $$('[data-verb]',s).forEach(b=>b.onclick=()=>({add:()=>addSheet({loc,sku}),take:()=>takeSheet({loc,sku}),move:()=>moveSheet({loc,sku}),count:()=>countSheet(loc)})[b.dataset.verb]());
   const m=$('#ssMap',s);if(m)m.onclick=()=>{selLoc=loc;closeSheet();go('map')}}})}
const verb=(v,l,dis)=>`<button class="verb" data-verb="${v}" ${dis?'disabled style="opacity:.35"':''}><span class="ico">${ic(v==='count'?'count':v==='move'?'move':v==='take'?'hand':'add')}</span>${l}</button>`;
function itemSheet(sku){openSheet({title:'Part',live:true,body:()=>{const i=item(sku);if(!i)return '<p class="empty">Part not found.</p>';const o=onHand(sku),oo=onOrder(sku);
  return `<div class="stack"><div class="hero"><p class="nm" style="margin:0">${esc(i.name)}</p><p class="sub fn">${esc(i.sku)}${i.vendor?' · '+esc(i.vendor):''}</p>
   <p class="big" style="margin-top:12px">${o.locs.length?(o.unk&&!o.n?'<span class="warn">Not counted</span>':esc(fmtQ(i,o.n))):'0'}</p>${fmtTot(i,o.n)?`<p class="tot">${fmtTot(i,o.n)}</p>`:''}${oo?`<p class="sub cap" style="margin-top:4px">${esc(fmtQ(i,oo))} on order</p>`:''}</div>
   <div class="verbs">${verb('add','Add')}${verb('take','Take',!o.locs.length)}${verb('move','Move',!o.locs.length)}${verb('count','Count',!o.locs.length&&!homeOf(sku).length)}</div>
   <div class="st"><p class="hd">Where it is</p><div class="group">${o.locs.length?o.locs.map(([l,q])=>`<button class="cell" data-sl2="${esc(l)}"><span class="tx"><b class="code">${esc(l)}</b><span class="t2">${esc(posText(LOC[l]))}</span></span><span class="val strong">${q==null?'?':esc(fmtQ(i,q))}</span>${chev}</button>`).join(''):'<p class="empty">Not in any spot yet</p>'}</div></div>
   <div class="group"><button class="cell" id="isEdit">${icoB('edit','#8E8E93')}<span class="tx"><b>Edit part</b></span>${chev}</button></div></div>`},
  bind:s=>{const o=onHand(sku),loc=o.locs[0]?.[0]||homeOf(sku)[0];

  foot:`<button class="btn" id="go">${ic('add')}Add</button>`,

   $('#go',s).onclick=()=>guard(async()=>{const p=readPart(s,'ap'),t=readSpot(s,'as'),q=readQty(s,'aq'),why=readSeg(s,'ar');

    await change(t,p,q);await logIt({type:'add',sku:p,to:t,qty:q,reason:why});toast(`Added ${fmtQ(item(p),q)} to ${t}`);closeSheet();if(route==='map'){selLoc=t;selectSpot(t,true)}})}})}
function takeSheet({loc,sku}){const opts=loc?lines(loc):[];openSheet({title:'Take stock',left:loc?`<button id="bk">${ic('back')}</button>`:'',body:`<div class="stack">
  <div class="st"><p class="hd">Part</p>${partPick('tp',sku)}</div>

  <div class="st"><p class="hd">How many</p><div id="tq">${qtyPick(item(sku),'tq',packOf(item(sku))?packOf(item(sku)).q:null)}</div></div>
  <div class="group">${field('Job #','<input id="tj" inputmode="text" placeholder="24-1182" autocomplete="off">')}</div></div>`,
  foot:`<button class="btn" id="go">${ic('hand')}Take</button>`,

   SH.picked=(e=>{$('#tf',s).innerHTML=fromPick('tf',e.detail,null);$('#tq',s).innerHTML=qtyPick(item(e.detail),'tq',null);initQty(s)});
   $('#go',s).onclick=()=>guard(async()=>{const p=readPart(s,'tp'),f=$('#tf select',s)?.value,q=readQty(s,'tq'),job=$('#tj',s).value.trim();
    if(!p)return toast('Choose a part',true);if(!f)return toast('Nothing to take from',true);if(!q)return toast('Enter how many',true);if(!job)return toast('Enter the job #',true);
    const short=await change(f,p,-q);await logIt({type:'pull',sub:'job',sku:p,from:f,qty:q,job});const now=new Date().toISOString();
    await W.set('outs',newOutId(),{type:'job',ref:job,status:'done',quick:true,lines:[{sku:p,qty:q,picked:q,from:[f]}],createdBy:whoId(),createdAt:now,doneBy:whoId(),doneAt:now});
    toast(short?`Taken. ${f} needs a recount.`:`Took ${fmtQ(item(p),q)} for ${job}`);closeSheet()})}})}
function fromPick(k,sku,loc){if(!sku)return '<div class="group"><p class="empty">Choose a part first</p></div>';const src=onHand(sku).locs;if(!src.length)return '<div class="group"><p class="empty">None in stock</p></div>';
 return `<div class="group">${field('Spot',`<select>${src.map(([l,q])=>`<option value="${esc(l)}"${l===loc?' selected':''}>${esc(l)} · ${q==null?'not counted':esc(fmtQ(item(sku),q))}</option>`).join('')}</select>`)}</div>`}
function moveSheet({loc,sku}){openSheet({title:'Move stock',left:loc?`<button id="bk">${ic('back')}</button>`:'',body:`<div class="stack">

   $('#go',s).onclick=()=>guard(async()=>{const p=readPart(s,'mp'),f=$('#mf select',s)?.value,t=readSpot(s,'mt'),q=readQty(s,'mq');
    if(!p||!f)return toast('Choose a part',true);if(!t)return toast('Choose where it goes',true);if(t===f)return toast('Same spot',true);if(!q)return toast('Enter how many',true);

    await change(f,p,-q);await change(t,p,q);await logIt({type:'move',sku:p,from:f,to:t,qty:q});toast(`Moved to ${t}`);closeSheet();if(route==='map')selectSpot(t,true)})}})}
let cDraft=null;
function countSheet(loc,fromCount){const l=LOC[loc];if(!l)return;const m=sinfo(loc);
 if(!cDraft||cDraft.loc!==loc){const base=lines(loc).map(x=>({sku:x.sku,qty:x.qty}));if(!base.length&&m.assign)base.push({sku:m.assign,qty:null});cDraft={loc,lines:base}}
 const known=lines(loc).some(x=>x.qty!=null);
 openSheet({title:'Count '+loc,body:`<div class="stack"><p class="sub cap" style="text-align:center">${esc(zone(l.z).name)} · ${esc(posText(l))}</p>
  ${cDraft.lines.map((x,k)=>{const i=item(x.sku),w=ruleFor(loc,i);return `<div class="st"><p class="hd" style="display:flex;justify-content:space-between"><span>${esc(i?i.name:x.sku)}</span><button class="pill" data-rm="${k}" style="min-height:24px;padding:0 10px;font-size:13px">Remove</button></p>${w?`<p class="bad fn" style="margin:0 16px">${esc(w)}</p>`:''}${qtyPick(i,'c'+k,x.qty)}</div>`}).join('')||'<div class="group"><p class="empty">Nothing here yet</p></div>'}
  <div class="st"><p class="hd">Add a part that’s here</p>${partPick('ca',null)}</div>
  ${known?`<div class="st"><p class="hd">If it changed, why</p><div class="group">${field('Reason','<select id="cr"><option>Miscount</option><option>Used, not logged</option><option>Damaged</option><option>Found extra</option><option>Moved, not logged</option><option>Other</option></select>')}</div></div>`:''}
  <div class="group"><details class="cell"><summary><span class="tx"><b>Can’t tell what it is?</b></span>${chev}</summary><div class="dbody stack" style="gap:10px">
   <div class="group" style="background:var(--bg)">${field('Kind',`<select id="uCat">${Object.entries(CATS).map(([k,n])=>`<option value="${k}"${(l.z==='BK'||l.z.startsWith('CL'))&&k==='board'?' selected':''}>${n}</option>`).join('')}</select>`)}${field('Looks like','<input id="uDesc" placeholder="Gray woodgrain">')}</div>
   ${ASSETS?'<label class="cap">Photo <input id="uPh" type="file" accept="image/*" capture="environment"></label>':''}<button class="btn gray" id="uAdd">Add as unknown</button></div></details></div></div>`,
  foot:`<div class="row2"><button class="btn gray" id="ce">Empty</button><button class="btn" id="cs">${ic('check')}Save</button></div>`,
  bind:s=>{initQty(s);const sync=()=>cDraft.lines.forEach((x,k)=>{const q=readQty(s,'c'+k);x.qty=q});
   $$('[data-rm]',s).forEach(b=>b.onclick=()=>{sync();cDraft.lines.splice(+b.dataset.rm,1);countSheet(loc,fromCount)});
   SH.picked=(e=>{if(!e.target.closest('[data-pk2="ca"]'))return;sync();if(!cDraft.lines.some(x=>x.sku===e.detail))cDraft.lines.push({sku:e.detail,qty:null});countSheet(loc,fromCount)});
   $('#uAdd',s).onclick=()=>guard(async()=>{sync();const cat=$('#uCat',s).value,desc=$('#uDesc',s).value.trim(),n=(S.meta.unk||0)+1,sku='UNK-'+String(n).padStart(4,'0');
    const it={sku,cat,name:`Unknown ${CATS[cat].toLowerCase().replace(/s$/,'')} ${n}${desc?': '+desc:''}`,uom:UNIT[cat],needsId:true,found:loc,min:0};
    const f=$('#uPh',s)&&$('#uPh',s).files[0];if(f&&ASSETS){try{const r=await ASSETS.upload(f);it.photo=r.url;it.photoId=r.id}catch(e){}}
    await W.set('meta','main',{...S.meta,unk:n});await W.set('items',docId(sku),it);cDraft.lines.push({sku,qty:null});countSheet(loc,fromCount)});
   const done=async(ls,msg)=>{await saveCount(loc,ls,$('#cr',s)?.value);toast(msg);cDraft=null;
    if(fromCount){const z=PHYS.filter(x=>x.z===l.z),k=z.findIndex(x=>x.id===loc),n=z.slice(k+1).find(x=>!sinfo(x.id).counted||sinfo(x.id).recount);if(n)return countSheet(n.id,true)}closeSheet()};
   $('#ce',s).onclick=()=>guard(()=>done([],`${loc} is empty`));
   $('#cs',s).onclick=()=>guard(async()=>{sync();if(!cDraft.lines.length)return toast('Add a part or tap Empty',true);if(cDraft.lines.some(x=>x.qty==null||Number.isNaN(x.qty)))return toast('Enter a count for each part',true);
    await done(cDraft.lines.map(x=>({sku:x.sku,qty:x.qty})),`${loc}: ${cDraft.lines.map(x=>fmtQ(item(x.sku),x.qty)).join(', ')}`)})}})}

 const sum=(f,key)=>{const m=new Map();L.filter(f).forEach(e=>{const i=item(e.sku);if(!i)return;const k=key(i);const o=m.get(k)||{k,q:0,i,jobs:new Set()};o.q+=e.qty;if(e.job)o.jobs.add(e.job);m.set(k,o)});return[...m.values()].sort((a,b)=>b.q-a.q)};
 const isOut=e=>e.type==='pull'||e.type==='cut',cat=e=>item(e.sku)?.cat;
 const saw=sum(e=>isOut(e)&&cat(e)==='board',i=>i.color||i.name),hw=sum(e=>isOut(e)&&['hardware','fastener'].includes(cat(e)),i=>i.sku),hd=sum(e=>isOut(e)&&cat(e)==='handle',i=>i.sku);

function parseGrid(t){const sep=t.includes('\t')?'\t':',';return t.split(/\r?\n/).filter(r=>r.trim()).map(r=>{if(sep==='\t')return r.split('\t').map(c=>c.trim());const out=[];let cur='',q=false;for(const ch of r){if(ch==='"')q=!q;else if(ch===','&&!q){out.push(cur.trim());cur=''}else cur+=ch}out.push(cur.trim());return out})}
function vImport(v){V.live=false;const F=IFIELDS[IMP.kind];
 v.innerHTML=`<div class="stack">${title('Import')}<div class="seg" role="group"><button data-k="po" aria-pressed="${IMP.kind==='po'}">Open POs</button><button data-k="item" aria-pressed="${IMP.kind==='item'}">Parts list</button></div>

  F.forEach(([k,,re])=>{const ix=g[0].findIndex((h,ix)=>re.test(h.toLowerCase())&&!Object.values(IMP.map).includes(ix));if(ix>=0)IMP.map[k]=ix});mapUI2()};if(IMP.rows)mapUI2()}

 $$('[data-m]').forEach(s=>s.onchange=()=>{IMP.map[s.dataset.m]=s.value===''?undefined:+s.value;prev()});prev();$('#iGo').onclick=()=>guard(doImport)}

 if(IMP.kind==='po'){if(IMP.map.po==null||IMP.map.qty==null||(IMP.map.sku==null&&IMP.map.desc==null)){p.innerHTML='<p class="empty warn">Match PO #, Quantity, and Part # or Description</p>';return}
  const by={};rs.forEach(r=>{if(r.po)(by[r.po]=by[r.po]||[]).push(r)});p.innerHTML=Object.keys(by).slice(0,8).map(x=>`<div class="cell"><span class="tx"><b>${esc(x)}${S.pos[docId(x)]?' <span class="warn fn">exists, skip</span>':''}</b><span class="t2">${esc(by[x][0].vendor)} · ${by[x].length} lines</span></span></div>`).join('')}

function normDate(s){if(!s)return '';if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;if(/^\d{5}$/.test(s))return new Date(Date.UTC(1899,11,30)+(+s)*864e5).toISOString().slice(0,10);const d=new Date(s);return isNaN(d)?'':ymd(d)}
const catGuess=t=>{t=(t||'').toLowerCase();return /hinge|slide|member|plate/.test(t)?'hardware':/screw|nail|brad/.test(t)?'fastener':/pull|knob|handle/.test(t)?'handle':/board|melamine|tfl|ply|sheet|mdf/.test(t)?'board':/strap|foam|cardboard|wrap/.test(t)?'packaging':/mold/.test(t)?'molding':'misc'};
async function doImport(){const rs=impRows();let made=0,ni=0;
 if(IMP.kind==='po'){const by={};rs.forEach(r=>{if(r.po)(by[r.po]=by[r.po]||[]).push(r)});
  for(const po in by){const id=docId(po);if(S.pos[id])continue;const ls=[];
   for(const r of by[po]){const q=parseFloat(String(r.qty).replace(/,/g,''));if(!(q>0))continue;let sku=(r.sku||'').toUpperCase()||null;
    if(!sku){const m=Object.values(S.items).find(i=>i.name.toLowerCase()===(r.desc||'').toLowerCase());sku=m?m.sku:'NEW-'+docId(r.desc).slice(0,24).toUpperCase()}
    if(!S.items[sku]){const cat=catGuess(r.desc);await W.set('items',docId(sku),{sku,name:r.desc||sku,cat,uom:r.uom||UNIT[cat],vendor:r.vendor||'',min:0,needsReview:true});ni++}
    ls.push({sku,desc:r.desc||item(sku)?.name||sku,ordered:Math.round(q),received:null,put:0})}
   if(!ls.length)continue;await W.set('pos',id,{po,vendor:by[po][0].vendor||'',expected:normDate(by[po][0].expected)||today(),status:'open',lines:ls,createdBy:whoId(),createdAt:new Date().toISOString(),imported:true});made++}
  toast(`${made} POs imported${ni?`, ${ni} new parts`:''}`);IMP={kind:'po',rows:null,map:{}};IN={tab:'exp',id:null,step:null};go('incoming')}
 else{for(const r of rs){if(!r.sku||!r.name)continue;const sku=r.sku.toUpperCase(),old=item(sku)||{},cat=old.cat||catGuess(r.cat+' '+r.name),pq=parseInt(r.pq);
   const n={...old,sku,name:r.name,cat,uom:r.uom||old.uom||UNIT[cat],vendor:r.vendor||old.vendor||'',vpn:r.vpn||old.vpn||'',min:parseFloat(r.min)||old.min||0};if(pq>1)n.pack={n:old.pack?.n||'box',q:pq};delete n._id;await W.set('items',docId(sku),n);made++}
  toast(`${made} parts imported`);IMP={kind:'item',rows:null,map:{}};go('items')}}

/* ---------- Setup ---------- */
const tsv=rows=>rows.map(r=>r.map(c=>String(c??'').replace(/[\t\n]/g,' ')).join('\t')).join('\n');
const stockRows=()=>[['Spot','Area','Part #','Part','Qty','Unit','Counted','For'],...Object.keys(S.stock).flatMap(l=>{const s=S.stock[l],ls=s.lines&&s.lines.length?s.lines:[{sku:'',qty:''}];return ls.map(x=>[l,zone(LOC[l]?.z)?.name||'',x.sku,item(x.sku)?.name||'',x.qty??'',x.sku?uom(item(x.sku)):'',s.counted?ymd(s.counted):'',s.assign||''])})];
const itemRows=()=>[['Part #','Name','Type','Unit','Pack','Per pack','Vendor','Vendor #','On hand','On order','Reorder at','Fill to','Cost'],...Object.values(S.items).map(i=>[i.sku,i.name,CATS[i.cat],uom(i),i.pack?.n||'',i.pack?.q||'',i.vendor||'',i.vpn||'',onHand(i.sku).n,onOrder(i.sku),i.min||'',i.max||'',i.cost||''])];
const logRows=()=>[['When','Type','Part #','Part','Qty','From','To','Job/PO','Reason','Who'],...S.log.map(e=>[e.t,e.type,e.sku,item(e.sku)?.name||'',e.qty,e.from||e.at||'',e.to||'',e.job||e.ref||'',e.reason||'',nameOf(e.who)])];
function vSetup(v){
 v.innerHTML=`<div class="stack">${title('Setup',liveLine())}
 ${MODE==='local'?`<div class="group">${field('Your name',`<input id="nm" value="${esc(sget(NKEY)||'')}" placeholder="Shown on your changes">`)}</div>`:''}
 <div class="st"><p class="hd">Copy to Google Sheets or Excel</p><div class="group">${[['stock','Stock by spot','box','#007AFF'],['items','Parts','list','#34C759'],['log','History','chart','#AF52DE']].map(([k,l,i,c])=>`<button class="cell" data-cp="${k}">${icoB(i,c)}<span class="tx"><b>${l}</b></span><span class="val">Copy</span></button>`).join('')}</div><p class="ft">Then tap cell A1 in a sheet and paste.</p></div>
 <div class="st"><p class="hd">Download</p><div class="group">${[['stock','Stock .csv'],['items','Parts .csv'],['log','History .csv']].map(([k,l])=>`<button class="cell" data-dl="${k}"><span class="tx"><b>${l}</b></span>${chev}</button>`).join('')}</div></div>
 <div class="st"><p class="hd">Rollout</p><div class="group">${rollout()}</div></div></div>`;
 const n=$('#nm');if(n)n.oninput=()=>sset(NKEY,n.value.trim());const R={stock:stockRows,items:itemRows,log:logRows};
 $$('[data-cp]').forEach(b=>b.onclick=()=>copyText(tsv(R[b.dataset.cp]()),'Copied'));
 $$('[data-dl]').forEach(b=>b.onclick=()=>saveFile(`force-${b.dataset.dl}-${today()}.csv`,R[b.dataset.dl]().map(r=>r.map(c=>/[",\n]/.test(String(c??''))?`"${String(c).replace(/"/g,'""')}"`:String(c??'')).join(',')).join('\n')))}
function rollout(){const lab=ZPHYS.filter(z=>(S.meta.labels||{})[z.id]).length,cnt=PHYS.filter(l=>sinfo(l.id).counted).length,des=PHYS.filter(l=>sinfo(l.id).assign).length,nonPal=Object.values(S.items).filter(i=>i.cat!=='pallet'),mins=nonPal.filter(i=>i.min>0).length;
 return [['Spots with a part set',des,PHYS.filter(l=>!['A','B','C'].includes(l.z)).length],['Areas labeled',lab,ZPHYS.length],['Spots counted',cnt,PHYS.length],['Parts with reorder point',mins,nonPal.length]].map(([t,a,b])=>`<div class="cell"><span class="tx"><b>${t}</b></span><span class="val">${a} / ${b}</span></div>`).join('')}

boot();
</script>

<script>
"use strict";
/* ================= basics ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const key=s=>String(s??'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>{d=new Date(d);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const fmt=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-US');
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dayLabel(s){if(!s)return 'No date';const t=today();if(s===t)return 'Today';if(s===addDays(t,1))return 'Tomorrow';if(s===addDays(t,-1))return 'Yesterday';const d=new Date(s+'T12:00:00');return `${DOW[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`}
function timeLabel(iso){if(!iso)return '';const d=new Date(iso);const h=d.getHours(),m=pad(d.getMinutes());return `${ymd(d)===today()?'':dayLabel(ymd(d))+' '}${(h%12)||12}:${m} ${h<12?'am':'pm'}`}
const plural=(n,w,ws)=>`${fmt(n)} ${n===1?w:(ws||w+'s')}`;

 today:'<path d="M4 7h16M8 3v4M16 3v4"/><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 12h3v3H8z"/>',

/* ================= accounts ================= */

   on the company site the server checks the password and these hashes are not used. */
const ACCTS={fcadmin:{role:'office',label:'Office'},fcwarehouse:{role:'shop',label:'Warehouse'}};
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

});

/* Three stores behind one interface: claude.ai db (preview), the company server (Netlify), or this device. */
function claudeStore(db){
 const subs=[];
 return{kind:'claude',
  start(cb){COLS.forEach(c=>{let q=db.collection(c);if(c==='log')q=q.orderBy('t','desc').limit(800);
    subs.push(q.onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]={...d.data(),id:d.id});S[c]=m;cb()},()=>toast('Live updates paused. Reopen the page.',true)))});
   subs.push(db.doc('meta/main').onSnapshot(d=>{S.meta=d.exists?d.data():{};cb()}))},
  async set(c,id,v){c==='meta'?await db.doc('meta/main').set(v):await db.collection(c).doc(id).set(v)},
  async del(c,id){await db.collection(c).doc(id).delete()},
  async mut(c,id,fn){const ref=db.collection(c).doc(id),me=uid();for(let i=0;i<16;i++){let r;try{r=await ref.acquire({holder:me,ttlMs:6000})}catch(e){r={acquired:true}}if(r&&r.acquired)break;await new Promise(z=>setTimeout(z,200))}
   let cur=null;try{const sn=await ref.get();cur=sn.exists?sn.data():null}catch(e){cur=S[c][id]?{...S[c][id]}:null}
   const nx=fn(cur?{...cur}:null);if(nx===undefined)return;if(nx===null)await ref.delete();else{delete nx.id;await ref.set(nx)}}}}
function serverStore(){
 let ver='',timer=0,cb=()=>{};
 const hdr=()=>({'content-type':'application/json',authorization:'Bearer '+(SESS&&SESS.token||'')});
 let wrote=0,pending=0;
 async function pull(){if(pending)return;const t0=Date.now();try{const r=await fetch('/api/state?v='+encodeURIComponent(ver),{headers:hdr()});if(r.status===401){signOut();return}if(r.status===200){const j=await r.json();if(pending||t0<=wrote)return;ver=j.v;COLS.forEach(c=>S[c]=j.state[c]||{});S.meta=j.state.meta||{};cb()}}catch(e){}}
 let sseq=0,sdone=0;
 async function send(ops){pending++;const my=++sseq;let r;try{r=await fetch('/api/ops',{method:'POST',headers:hdr(),body:JSON.stringify({ops})})}finally{pending--;wrote=Date.now()}if(r.status===401){signOut();throw new Error('Signed out')}if(!r.ok)throw new Error(((await r.json().catch(()=>({}))).error)||'Save failed');const j=await r.json();if(my<sdone)return;sdone=my;ver=j.v;COLS.forEach(c=>S[c]=j.state[c]||{});S.meta=j.state.meta||{};cb()}
 let started=false;return{kind:'server',start(f){cb=f;pull();if(started)return;started=true;timer=setInterval(()=>{if(!document.hidden)pull()},2500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()})},
  set:(c,id,v)=>send([{op:'set',c,id,v}]),del:(c,id)=>send([{op:'del',c,id}]),batch:ops=>send(ops),
  async mut(c,id,fn){const nx=fn(S[c][id]?{...S[c][id]}:null);if(nx===undefined)return;
   // the server re-applies numeric deltas to its latest copy; plain fields are last-writer-wins
   await send([nx===null?{op:'del',c,id}:{op:'mut',c,id,v:nx,base:S[c][id]||null}])}}}
function localStore(){
 const K='fc-local-db';let bc=null;try{bc=new BroadcastChannel('fc-local')}catch(e){}
 const load=()=>{try{const j=JSON.parse(sget(K)||'{}');COLS.forEach(c=>S[c]=j[c]||{});S.meta=j.meta||{}}catch(e){}};
 const save=()=>{const j={meta:S.meta};COLS.forEach(c=>j[c]=S[c]);sset(K,JSON.stringify(j));bc&&bc.postMessage(1)};
 let cb=()=>{};
 return{kind:'local',start(f){cb=f;load();cb();bc&&(bc.onmessage=()=>{load();cb()})},
  async set(c,id,v){if(c==='meta')S.meta=v;else S[c][id]={...v,id};save();cb()},
  async del(c,id){delete S[c][id];save();cb()},
  async mut(c,id,fn){const nx=fn(S[c][id]?{...S[c][id]}:null);if(nx===undefined)return;if(nx===null)delete S[c][id];else S[c][id]={...nx,id};save();cb()}}}
const W={
 set:(c,id,v)=>STORE.set(c,id,clean(v)),del:(c,id)=>STORE.del(c,id),
 batch:async ops=>{if(STORE.batch){for(let i=0;i<ops.length;i+=150)await STORE.batch(ops.slice(i,i+150).map(o=>({...o,v:clean(o.v)})));return}for(let i=0;i<ops.length;i+=8)await Promise.all(ops.slice(i,i+8).map(o=>o.op==='del'?STORE.del(o.c,o.id):STORE.set(o.c,o.id,clean(o.v))))},mut:(c,id,fn)=>STORE.mut(c,id,x=>{const r=fn(x);return r?clean(r):r}),
 meta:v=>STORE.set('meta','main',clean({...S.meta,...v}))};
function clean(o){if(!o||typeof o!=='object')return o;const r={};for(const k in o){if(o[k]===undefined||k==='id')continue;r[k]=o[k]}return r}
async function logIt(e){e.t=new Date().toISOString();e.day=today();e.who=ME||'Someone';e.acct=SESS&&SESS.u;await W.set('log',uid(),e)}

/* ================= model ================= */
const items=()=>Object.values(S.items);
const item=sku=>S.items[key(sku)]||null;
const descOf=sku=>item(sku)?.desc||Object.values(S.orders).find(o=>key(o.sku)===key(sku))?.desc||sku;
function guessType(desc,sku){const s=(desc+' '+sku).toLowerCase();if(/door/.test(s))return 'doors';if(/cardboard|carton|foam|strap|stretch|wrap|tape|corner guard/.test(s))return 'packaging';if(/board|melamine|sheet|plywood|particle|mdf|\b6\s?mm|3\/4|panel/.test(s))return 'boards';return 'hardware'}
const typeOf=sku=>item(sku)?.type||guessType(descOf(sku),sku);
function thkOf(i){if(!i)return '';if(i.thk)return i.thk;const s=(i.desc||'')+' '+(i.sku||'');return /6\s?mm|1\/4/i.test(s)?'6mm':/3\/4|19\s?mm|\.75/i.test(s)?'3/4"':''}
const isWhite=i=>/white/i.test((i&&(i.color||i.desc))||'');
const PACKU=/^(box|boxes|bx|case|cases|cs|bundle|bundles|unit|units|pallet|pallets|plt|carton|cartons|roll|rolls|bag|bags|pk|pack|packs)$/i;
const isPackUnit=u=>PACKU.test(String(u||'').trim());
const packOf=sku=>{const i=item(sku);return i&&i.pack>0?+i.pack:0};
const orders=()=>Object.values(S.orders).filter(o=>!o.gone&&o.status!=='Closed');
const linesOf=po=>orders().filter(o=>key(o.po)===key(po));
const recvOf=o=>S.recv[o.id]||{};
const putOf=o=>+recvOf(o).put||0;
const issuesOf=o=>Object.values(S.issues).filter(i=>i.orderId===o.id);
const openIssue=i=>i.status==='open'||i.status==='reordered';
// qty not coming on this truck: open missing/short/backorder; reordered missing comes on a new PO
const notComing=o=>issuesOf(o).filter(i=>openIssue(i)&&['missing','short','backorder'].includes(i.kind)).reduce((a,i)=>a+(+i.qty||0),0);
const lineLeft=o=>Math.max(0,(+o.qty||0)-putOf(o)-notComing(o));
const arrivalOf=po=>S.arrivals[key(po)]||null;
function deliveries(){const m={};orders().forEach(o=>{const k=key(o.po);(m[k]=m[k]||{po:o.po,k,lines:[]}).lines.push(o)});
 return Object.values(m).map(d=>{const L=d.lines;d.vendor=[...new Set(L.map(o=>o.vendor).filter(Boolean))].join(', ')||'Vendor not listed';
  d.date=L.map(o=>o.date).filter(Boolean).sort()[0]||'';d.types=[...new Set(L.map(o=>o.type||typeOf(o.sku)))];
  d.arr=arrivalOf(d.po);d.cancelled=L.every(o=>o.status==='Cancelled');d.delayed=!d.cancelled&&L.some(o=>o.status==='Delayed');
  d.issues=Object.values(S.issues).filter(i=>key(i.po)===d.k&&openIssue(i));d.left=L.reduce((a,o)=>a+lineLeft(o),0);
  d.state=d.cancelled?'cancelled':d.arr?(d.issues.length?'issues':'arrived'):d.delayed?'delayed':!d.date?'nodate':d.date<today()?'late':d.date===today()?'due':'upcoming';return d})}
const STATE={due:['Due today','act'],late:['Late','bad'],delayed:['Delayed','warn'],upcoming:['Coming','muted'],nodate:['No date','muted'],arrived:['Arrived','ok'],issues:['Arrived · issues','bad'],cancelled:['Cancelled','muted']};
const statePill=d=>{const[t,c]=STATE[d.state];return `<span class="pill ${c}">${esc(t)}${d.state==='issues'?' '+d.issues.length:''}</span>`};
function summaryOf(d){return d.lines.slice(0,3).map(o=>`${fmt(o.qty)} ${o.unit||''} ${o.desc||o.sku}`.replace(/\s+/g,' ')).join(' · ')+(d.lines.length>3?` · +${d.lines.length-3} more`:'')}
const units=()=>Object.values(S.units);
const unitsOf=sku=>units().filter(u=>key(u.sku)===key(sku)&&u.qty>0);
const unitsAt=loc=>units().filter(u=>u.loc===loc&&u.qty>0);
const onHand=sku=>unitsOf(sku).reduce((a,u)=>a+(+u.qty||0),0);
function onOrder(sku){return orders().filter(o=>key(o.sku)===key(sku)&&o.status!=='Cancelled').reduce((a,o)=>{const l=lineLeft(o);return a+(isPackUnit(o.unit)&&packOf(sku)?l*packOf(sku):l)},0)}
function qtyText(sku,q){const t=typeOf(sku),u=BASEU[t],p=packOf(sku);if(t==='hardware'&&p>1&&q>=p){const b=Math.floor(q/p),r=q%p;return `${fmt(q)} ${u} · ${plural(b,'box','boxes')}${r?` + ${fmt(r)}`:''}`}return `${fmt(q)} ${u}`}
const lowOf=i=>i.min>0&&onHand(i.sku)+onOrder(i.sku)<=i.min;
function ruleFor(loc,sku,isNew){const l=LOC[loc];if(!l)return 'No such spot.';const t=typeOf(sku),i=item(sku)||{sku,desc:descOf(sku)},z=l.z,here=unitsAt(loc);
 if(['BK','CL1','CL2','BD'].includes(z)&&t!=='boards')return `${zone(z).name} hold boards only.`;
 if(z==='DR'&&t!=='doors')return 'The doors area holds door pallets only.';
 if(t==='boards'&&!['BK','CL1','CL2','BD'].includes(z))return 'Boards go in the bunks, cantilevers or board drop.';
 if(t==='doors'&&z!=='DR')return 'Door pallets go in the doors area.';
 if(z==='R0'&&l.L===4&&!/cardboard/i.test(i.desc||''))return 'The top of Supplies is cardboard only.';
 if(z==='D'&&!palAt(loc)){const other=here.find(u=>!u.pal&&key(u.sku)!==key(sku));if(other)return `${loc} already has ${other.sku}. One item number per spot on Rack D, or put a pallet there.`}
 if(z==='BK'){const th=thkOf(i),b=l.bunk,c=l.col;
  if(isNew&&here.length>=5)return `${loc} already has 5 stacks.`;
  if(th==='6mm'&&b!==4)return '6 mm goes in Bunk 4.';if(th==='3/4"'&&b===4)return 'Bunk 4 is 6 mm only.';
  if(th==='3/4"'){const w=isWhite(i);if(b===1&&!w)return 'Bunk 1 is white only.';if(b===3&&w)return 'Bunk 3 is colored only.';if(b===2&&c>=3&&!w)return 'Bunk 2 columns 3–4 are white.';if(b===2&&c<=2&&w)return 'Bunk 2 columns 1–2 are colored.'}}
 return null}
function suggestLoc(sku){const u=unitsOf(sku)[0];if(u)return u.loc;const t=typeOf(sku);if(t!=='boards')return '';const i=item(sku)||{desc:descOf(sku)},th=thkOf(i),w=isWhite(i);
 const want=th==='6mm'?[4]:w?[1,2]:[3,2];for(const b of want)for(let c=1;c<=4;c++){const id=`BK${b}-${c}`;if(!ruleFor(id,sku,true))return id}return ''}

 let body='';try{body=VIEWS[V].render()}catch(e){console.error(e);body=`<p class="note bad">This screen hit a problem: ${esc(e.message)}</p>`}

 if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});if(sel&&el.setSelectionRange)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}

/* ---------- login ---------- */
function loginView(){return `<div class="login"><form class="card" id="lf" autocomplete="on"><div class="mark"><i></i>FORCE</div><div><h1>Sign in</h1><p class="muted small" style="margin:6px 0 0">Gilbert warehouse · receiving and inventory</p></div>
 <label class="field"><span>User name</span><input class="in" id="lu" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
 <label class="field"><span>Password</span><input class="in" id="lp" name="password" type="password" autocomplete="current-password" required></label>
 <p class="note bad" id="lerr" hidden></p><button class="btn pri block" id="lgo">Sign in</button></form></div>`}
function bindLogin(){$('#lf').addEventListener('submit',async e=>{e.preventDefault();const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value,err=$('#lerr');err.hidden=true;
 await busy($('#lgo'),async()=>{
  if(MODE==='server'){const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({u,p})});if(!r.ok){err.textContent='That user name or password didn’t match.';err.hidden=false;return}const j=await r.json();SESS={u:j.u,role:j.role,token:j.token}}
  else{const h=await sha256(u+'|'+p);if(!ACCTS[u]||h!==ACCT_H[u]){err.textContent='That user name or password didn’t match.';err.hidden=false;return}SESS={u,role:ACCTS[u].role}}
  sset(SESS_K,JSON.stringify(SESS));ME=sget(NAME_K);if(MODE==='server')STORE.start(onData);render()})})}
function signOut(){SESS=null;ME=null;sset(SESS_K,null);sset(NAME_K,null);location.hash='';render()}
function nameView(){const ppl=(S.meta.people||[]);return `<div class="login"><div class="card"><div class="mark"><i></i>FORCE</div><div><h1>Who’s using this?</h1><p class="muted small" style="margin:6px 0 0">Your name goes on what you receive, put away and report.</p></div>
 ${ppl.length?`<div class="chips">${ppl.map(n=>`<button class="chip" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:''}
 <label class="field"><span>${ppl.length?'Not listed? Type your name':'Your name'}</span><input class="in" id="nn" autocomplete="given-name"></label><button class="btn pri block" id="ngo">Continue</button></div></div>`}
function bindName(){$$('[data-name]').forEach(b=>b.addEventListener('click',()=>setName(b.dataset.name)));$('#ngo').addEventListener('click',()=>{const n=$('#nn').value.trim();if(n)setName(n,true)});$('#nn').addEventListener('keydown',e=>{if(e.key==='Enter')$('#ngo').click()})}
async function setName(n,add){ME=n;sset(NAME_K,n);render();if(add&&!(S.meta.people||[]).includes(n))try{await W.meta({people:[...(S.meta.people||[]),n]})}catch(e){}}

const VIEWS={};
const delRow=d=>`<button class="row" data-del="${esc(d.po)}"><span class="tx"><b>${esc(d.vendor)}</b><span class="t2">PO ${esc(d.po)} · ${esc(d.types.map(t=>TYPES[t]).join(', '))}</span><span class="t2">${esc(summaryOf(d))}</span></span><span class="end">${statePill(d)}${d.state==='delayed'||d.state==='upcoming'||d.state==='late'?`<span class="t2">${esc(dayLabel(d.date))}</span>`:''}${d.arr?`<span class="t2">${esc(timeLabel(d.arr.at))}</span>`:''}</span>${ico('chev',20)}</button>`;

VIEWS.today={render(){const D=deliveries(),t=today();
 const due=D.filter(d=>d.state==='due'),late=D.filter(d=>d.state==='late'),delayed=D.filter(d=>d.state==='delayed'),arr=D.filter(d=>d.arr&&ymd(d.arr.at)===t),soon=D.filter(d=>d.state==='upcoming'&&d.date<=addDays(t,7)).sort((a,b)=>a.date<b.date?-1:1);
 const bo=orders().filter(o=>issuesOf(o).some(i=>openIssue(i)&&i.kind==='backorder'));
 const grp=(h,L,emp)=>`<section><div class="sh"><h2>${h}</h2><span class="muted num">${L.length||''}</span></div>${L.length?`<div class="list">${L.map(delRow).join('')}</div>`:emp?`<div class="list"><p class="empty">${emp}</p></div>`:''}</section>`;
 if(!orders().length)return topBar(dayLabel(t),'Deliveries')+daySwitch('today')+`<div class="list"><p class="empty">No orders yet. ${isOffice()?'Import the order Excel under Orders.':'The office imports the order Excel; deliveries show here once it’s in.'}</p></div>`;
 return topBar(dayLabel(t),'Deliveries')+daySwitch('today')+grp('Due today',due,'Nothing else due today.')+(late.length?grp('Late',late):'')+(delayed.length?grp('Delayed',delayed):'')+
  (bo.length?`<section><div class="sh"><h2>Backorders still coming</h2></div><div class="list">${bo.map(o=>`<button class="row" data-del="${esc(o.po)}"><span class="tx"><b>${esc(o.desc||o.sku)}</b><span class="t2">${esc(o.vendor||'')} · PO ${esc(o.po)}</span></span><span class="end"><span class="pill info">${fmt(issuesOf(o).filter(i=>openIssue(i)&&i.kind==='backorder').reduce((a,i)=>a+(+i.qty||0),0))} on backorder</span></span>${ico('chev',20)}</button>`).join('')}</div></section>`:'')+
  grp('Arrived today',arr,'Nothing checked in yet today.')+(soon.length?grp('Next 7 days',soon):'')}};

VIEWS.delivery={render(){const d=deliveries().find(x=>x.k===key(VIEW.po));if(!d)return topBar('Not found','Delivery','today')+'<p class="note">This PO isn’t on the order sheet anymore.</p>';
 const lines=d.lines.map(o=>{const iss=issuesOf(o).filter(openIssue),p=putOf(o),it=o.type||typeOf(o.sku);
  return `<div class="row"><span class="tx"><b>${esc(o.desc||o.sku)}</b><span class="t2">${esc(o.sku)}${o.job?' · Job '+esc(o.job):''}${o.note?' · '+esc(o.note):''}</span>
   ${d.arr?`<span class="t2">Put away ${fmt(p)} of ${fmt(o.qty)}${lineLeft(o)?'':' ✓'}</span>`:''}${iss.map(i=>`<span class="t2" style="color:var(--${i.kind==='extra'||i.kind==='backorder'?'info':'bad'})">${esc(KIND[i.kind])} ${fmt(i.qty)}${i.note?' · '+esc(i.note):''}${i.kind==='backorder'?` <button class="btn sm" data-boin="${i.id}">It arrived</button>`:''}</span>`).join('')}</span>
   <span class="end"><span class="big">${fmt(o.qty)}</span><span class="t2">${esc(o.unit||BASEU[it])}</span></span></div>`}).join('');
 const acts=d.state==='cancelled'?'':!d.arr?`<div class="btns"><button class="btn pri" data-allhere>All here, all good</button><button class="btn" data-wrong>Something’s wrong</button></div><p class="muted small" style="margin:0">Check it against the paper. One tap if it matches. Only report what’s different.</p>`
  :`<div class="btns">${d.left&&!isOffice()?`<button class="btn pri" data-putpo>Put away now (${d.lines.filter(lineLeft).length} ${d.lines.filter(lineLeft).length===1?'item':'items'})</button>`:''}<button class="btn" data-wrong>Report a problem</button></div>`;
 return topBar(d.vendor,`PO ${d.po} · ${d.date?'Expected '+dayLabel(d.date):'No date'}`,'today')+`<div>${statePill(d)}${d.arr?` <span class="muted small">Checked in ${esc(timeLabel(d.arr.at))} by ${esc(d.arr.by)}${d.arr.count?` · ${esc(d.arr.count)} on the truck`:''}</span>`:''}</div>${acts}<section><div class="sh"><h2>On this order</h2><span class="muted">${plural(d.lines.length,'line')}</span></div><div class="list">${lines}</div></section>`},
 bind(m){const d=deliveries().find(x=>x.k===key(VIEW.po));if(!d)return;
  $('[data-allhere]',m)?.addEventListener('click',e=>busy(e.target,async()=>{await markArrived(d.po,0);toast(`${d.vendor} checked in. The office sees it now.`);render()}));
  $('[data-wrong]',m)?.addEventListener('click',()=>issueSheet({po:d.po,dock:!d.arr}));
  $('[data-putpo]',m)?.addEventListener('click',()=>{VIEW.putpo=d.po;go('putaway')});
  $$('[data-boin]',m).forEach(b=>b.addEventListener('click',()=>busy(b,async()=>{const i=S.issues[b.dataset.boin];await W.set('issues',i.id,{...i,status:'archived',closeNote:'Backorder arrived',closedAt:new Date().toISOString(),closedBy:ME});await logIt({type:'backorder-in',sku:i.sku,qty:i.qty,po:i.po});toast(`Backorder in. ${descOf(i.sku)} is ready to put away.`)})))}};
async function markArrived(po,count){if(arrivalOf(po))return;await W.set('arrivals',key(po),{po,at:new Date().toISOString(),by:ME,count:count||0});await logIt({type:'arrived',po})}
const KIND={missing:'Missing',short:'Short',damaged:'Damaged',wrong:'Wrong item',backorder:'Backorder',extra:'Extra',other:'Other'};
function issueSheet(o={}){const L=o.po?linesOf(o.po):[];let sel=o.orderId||'';
 openSheet(o.po?'What’s wrong?':'Report a problem',`${o.po?`<div class="field"><span>Which item</span><div class="list" id="ilines">${L.map(x=>`<button type="button" class="row" data-line="${x.id}" aria-pressed="${x.id===sel}"><span class="tx"><b>${esc(x.desc||x.sku)}</b><span class="t2">${esc(x.sku)} · ordered ${fmt(x.qty)} ${esc(x.unit||'')}</span></span></button>`).join('')}</div></div>`:
  `<label class="field"><span>Item # or description</span><input class="in" id="isku" list="skus" autocomplete="off" placeholder="e.g. Vanity 45 sink base door"><datalist id="skus">${items().map(i=>`<option value="${esc(i.sku)}">${esc(i.desc||'')}</option>`).join('')}</datalist></label>`}
  <div class="field"><span>What happened</span>${chips('kind',(o.po?['missing','short','damaged','wrong','backorder','extra','other']:['damaged','missing','wrong','other']).map(k=>[k,KIND[k]]),o.kind||(o.po?'':'damaged'))}</div>
  <div class="field"><span>How many</span>${stepper('iqty',1,1)}</div>
  ${o.po?'':`<label class="field"><span>Job # (optional)</span><input class="in" id="ijob" inputmode="text"></label>`}
  <label class="field"><span>Note</span><textarea class="in" id="inote" placeholder="e.g. scratched, needs reorder"></textarea></label>
  <p class="note bad" id="ierr" hidden></p><button class="btn pri block" data-primary id="igo">Send to the office</button>`,sh=>{
  $$('[data-line]',sh).forEach(b=>{b.style.cursor='pointer';b.addEventListener('click',()=>{sel=b.dataset.line;$$('[data-line]',sh).forEach(x=>{x.setAttribute('aria-pressed',x===b);x.style.background=x===b?'var(--actSoft)':''})});if(b.dataset.line===sel)b.style.background='var(--actSoft)'});
  $('#igo',sh).addEventListener('click',e=>busy(e.target,async()=>{const kind=chipv(sh,'kind'),qty=numv('iqty'),note=$('#inote',sh).value.trim(),err=$('#ierr',sh);err.hidden=true;
   const ln=sel?S.orders[sel]:null,sku=ln?ln.sku:($('#isku',sh)?.value.trim()||'');
   if(o.po&&!ln){err.textContent='Tap the item it’s about.';err.hidden=false;return}if(!sku){err.textContent='Type the item # or what it is.';err.hidden=false;return}if(!kind){err.textContent='Pick what happened.';err.hidden=false;return}
   const id=uid();await W.set('issues',id,{kind,sku:ln?ln.sku:(item(sku)?.sku||sku),qty,note,po:ln?ln.po:'',vendor:ln?ln.vendor:'',orderId:ln?ln.id:'',job:$('#ijob',sh)?.value.trim()||ln?.job||'',src:o.po?(o.dock?'dock':'put away'):'floor',status:'open',t:new Date().toISOString(),by:ME});
   if(o.po&&o.dock)await markArrived(o.po,0);
   await logIt({type:'issue',kind,sku,qty,po:ln?.po,note});closeSheet();toast(`${KIND[kind]} ${fmt(qty)} · sent to the office.`);render()}))})}

/* ---------- put away ---------- */
VIEWS.putaway={render(){const D=deliveries().filter(d=>d.arr&&d.left>0);if(VIEW.putpo&&!D.find(d=>d.k===key(VIEW.putpo)))VIEW.putpo='';
 const one=VIEW.putpo?D.find(d=>d.k===key(VIEW.putpo)):null,list=one?[one]:D;
 if(!list.length)return topBar('Put away','Nothing waiting')+'<div class="list"><p class="empty">Nothing is waiting to be put away. Deliveries show here after they’re checked in.</p></div>';
 return topBar('Put away',one?`${one.vendor} · PO ${one.po}`:`${D.length} ${D.length===1?'delivery':'deliveries'} on the dock`,one?'putaway':'')+(one?`<button class="btn sm" data-allput style="align-self:flex-start">Show all deliveries</button>`:'')+
  list.map(d=>`<section><div class="sh"><h2>${esc(d.vendor)}</h2><span class="muted">PO ${esc(d.po)} · in ${esc(timeLabel(d.arr.at))}</span></div><div class="list">${d.lines.map(o=>{const l=lineLeft(o),p=putOf(o),pct=Math.min(100,(p/(+o.qty||1))*100);
   return `<button class="row" data-pl="${o.id}" ${l?'':'disabled'}><span class="tx"><b>${esc(o.desc||o.sku)}</b><span class="t2">${esc(o.sku)}</span><div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div></span><span class="end"><span class="big num">${fmt(p)}<span class="muted" style="font-size:15px"> / ${fmt(o.qty)}</span></span><span class="t2">${esc(o.unit||BASEU[o.type||typeOf(o.sku)])}${l?'':' ✓'}</span></span></button>`}).join('')}</div></section>`).join('')},
 bind(m){$('[data-allput]',m)?.addEventListener('click',()=>{VIEW.putpo='';render()});$$('[data-pl]',m).forEach(b=>b.addEventListener('click',()=>putSheet(S.orders[b.dataset.pl])))}};
/* One sheet per order line. Hardware: boxes × per-box. Boards: one stack per entry (from its slip). Packaging: one pallet per entry. Doors: pallets. */
function putSheet(o){const sku=o.sku,t=o.type||typeOf(sku),it=item(sku)||{sku,desc:o.desc},pk=packOf(sku),unit=o.unit||BASEU[t],packU=isPackUnit(unit);
 const needPack=(t==='hardware'||(t==='packaging'&&packU))&&!pk,needThk=t==='boards'&&!thkOf(it);
 const lbl=t==='boards'?'Sheets in this stack (from its slip)':t==='packaging'?(packU?unit.charAt(0).toUpperCase()+unit.slice(1):'Pieces on this pallet'):t==='doors'?'Door pallets':'Boxes';
 const tally=()=>`<div class="tally"><span class="muted">Put away</span><span class="big num">${fmt(putOf(S.orders[o.id]||o))} <span class="muted" style="font-size:16px">of ${fmt(o.qty)} ${esc(unit)}</span></span></div>`;
 const sh=openSheet(o.desc||sku,`<p class="muted" style="margin:0">${esc(sku)} · PO ${esc(o.po)}</p><div id="tl">${tally()}</div>
  ${needPack?`<label class="field"><span>How many pieces in one ${t==='packaging'?esc(unit.replace(/e?s$/,'')):'box'}? (set once for this item)</span><input class="in num" id="ppk" inputmode="numeric" placeholder="e.g. 20"></label>`:''}
  ${needThk?`<div class="field"><span>Board type (set once)</span>${chips('thk',[['3/4"','3/4"'],['6mm','6 mm']],'')}${chips('wh',[['white','White'],['color','Colored']],'')}</div>`:''}
  <div class="field"><span>${lbl}</span>${stepper('pq',t==='doors'?1:t==='boards'?Math.min(+o.qty-putOf(o),40)||1:t==='hardware'?Math.max(1,Math.round(pk&&!packU?lineLeft(o)/pk:lineLeft(o)))||1:1,0)}</div>
  ${t==='hardware'?`<label class="field"><span>Loose pieces (optional)</span><input class="in num" id="ploose" inputmode="numeric" value="0"></label>`:''}<p class="calc" id="pcalc"></p>
  <div class="field"><span>Spot</span>${spotPick('ploc',sku,suggestLoc(sku))}</div>
  <p class="note bad" id="perr" hidden></p><button class="btn pri block" data-primary id="pgo">Put away</button><button class="btn block" id="pdone">Done with this item</button>`,sh=>{
  const g=$('#ploc',sh);g.dataset.newunit=t==='hardware'?'0':'1';
  const calc=()=>{const p=pk||numv('ppk'),q=numv('pq'),lo=numv('ploose');$('#pcalc',sh).textContent=t==='hardware'?(p?`${fmt(q)} × ${fmt(p)} + ${fmt(lo)} = ${fmt(q*p+lo)} pcs`:'Enter pieces per box'):t==='packaging'&&packU?(p?`${fmt(q)} × ${fmt(p)} = ${fmt(q*p)} pcs`:''):t==='boards'?`Stack of ${fmt(q)} sheets`:''};
  sh.addEventListener('input',calc);calc();
  $('#pgo',sh).addEventListener('click',e=>busy(e.target,async()=>{const err=$('#perr',sh);err.hidden=true;const fail=m=>{err.textContent=m;err.hidden=false};
   const p=pk||numv('ppk'),q=numv('pq'),lo=numv('ploose');if(needPack&&!p)return fail('Enter how many pieces come in one.');if(q<=0&&!(lo>0))return fail('Enter how many.');
   if(needThk&&(!chipv(sh,'thk')||!chipv(sh,'wh')))return fail('Pick the board thickness and white or colored.');
   if(needThk||needPack||!item(sku))await W.set('items',key(sku),{...(item(sku)||{sku,desc:o.desc,type:t}),...(needPack?{pack:p}:{}),...(needThk?{thk:chipv(sh,'thk'),color:chipv(sh,'wh')==='white'?'White':'Colored'}:{})});
   locUpdate(g);const loc=locVal(sh,'ploc');if(!loc)return fail($('.locmsg',g).textContent||'Type a spot.');
   const base=t==='hardware'?q*p+lo:t==='packaging'&&packU?q*p:q;
   const tal=t==='hardware'?(packU?q+lo/p:base):t==='packaging'?(packU?q:base):t==='boards'&&packU&&pk?q/pk:q;
   await putUnit(sku,loc,base,t,o.po);await W.mut('recv',o.id,c=>({...(c||{}),put:(+(c&&c.put)||0)+tal,by:ME,t:new Date().toISOString()}));
   await logIt({type:'put',sku,qty:base,loc,po:o.po});await afterPut(o);
   toast(`${t==='boards'?'Stack of '+fmt(base):qtyText(sku,base)} → ${loc}`);
   $('#tl',sh).innerHTML=tally();if(!lineLeft(S.orders[o.id]||o)){closeSheet();const nx=linesOf(o.po).find(x=>lineLeft(x));render();if(nx){toast(`${o.desc||sku} done ✓ · next: ${nx.desc||nx.sku}`);putSheet(nx)}else toast(`PO ${o.po} is all put away ✓`)}
   else{if(t!=='hardware'){$('#pq',sh).value=t==='boards'?Math.min(lineLeft(S.orders[o.id]),40):1;calc()}}}));
  $('#pdone',sh).addEventListener('click',()=>{const l=lineLeft(S.orders[o.id]||o);if(!l){closeSheet();return}
   openSheet(`${fmt(l)} ${unit} not put away`,`<p style="margin:0">${esc(o.desc||sku)}: ${fmt(putOf(o))} of ${fmt(o.qty)} put away.</p><div class="btns" style="flex-direction:column"><button class="btn pri" id="sm">Report ${fmt(l)} missing</button><button class="btn" id="sb">It’s on backorder</button><button class="btn" id="sl">Finish later</button></div>`,s2=>{
    const mk=kind=>busy($('#'+(kind==='missing'?'sm':'sb'),s2),async()=>{await W.set('issues',uid(),{kind,sku,qty:l,po:o.po,vendor:o.vendor,orderId:o.id,src:'put away',status:'open',t:new Date().toISOString(),by:ME,note:''});await logIt({type:'issue',kind,sku,qty:l,po:o.po});closeSheet();toast(`${KIND[kind]} ${fmt(l)} · sent to the office.`);render()});
    $('#sm',s2).addEventListener('click',()=>mk('missing'));$('#sb',s2).addEventListener('click',()=>mk('backorder'));$('#sl',s2).addEventListener('click',()=>{closeSheet();render()})})})})}
async function putUnit(sku,loc,qty,t,po){const pl=palAt(loc);if(t==='hardware'||pl&&t!=='boards'){const id=pl?`u_P${pl.id}_${key(sku)}`:`u_${key(loc)}_${key(sku)}`;await W.mut('units',id,c=>({sku:item(sku)?.sku||sku,loc,qty:(+(c&&c.qty)||0)+qty,kind:'boxes',...(pl?{pal:pl.id}:{}),t:new Date().toISOString(),by:ME}))}

function mapHL(doFly){if(!W3)return;const strong=new Set(VIEW.mapSku?unitsOf(VIEW.mapSku).map(u=>u.loc):[]),hl=new Set();
 if(!VIEW.mapSku&&((VIEW.q||'').trim()||VIEW.cat))findList(VIEW.q).slice(0,60).forEach(i=>unitsOf(i.sku).forEach(u=>hl.add(u.loc)));
 W3.highlight(hl,strong,doFly);if(doFly)VIEW.mapSku=VIEW.mapSku}

/* ================= scanning ================= */
let CAM=null;
function stopCam(){if(CAM){CAM.stop=true;CAM.stream&&CAM.stream.getTracks().forEach(t=>t.stop());CAM=null}}
function handleScan(txt){txt=String(txt||'').trim();closeSheet();if(!txt)return;
 const pq=txt.match(/^FORCE:PAL:(.+)$/i);if(pq){if(S.pallets[pq[1]]){VIEW.pal=pq[1];go('pallet')}else toast('That pallet was deleted or isn’t in the app.',true);return}
 const sp=txt.match(/^FORCE:SPOT:(.+)$/i);if(sp){const l=normLoc(sp[1]);if(l){VIEW.loc=l;go('spot');return}}
 const hw=txt.match(/^FORCE:HW:(.+)$/i);const raw=hw?hw[1]:txt;
 if(/^Pallet:/i.test(txt))return toast('That’s an old cabinet pallet sheet. Cabinet pallets aren’t in this app yet.',true);
 const l=normLoc(raw);if(l){VIEW.loc=l;go('spot');return}
 const it=item(raw)||items().find(i=>(i.aliases||[]).some(a=>key(a)===key(raw)));if(it){VIEW.sku=it.sku;go('item');return}
 VIEW.q=raw.split(/\r?\n/)[0];go('find');toast('No exact match. Showing search results.')}
async function scanSheet(){const live=MODE!=='claude'&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia;
 const sh=openSheet('Scan',`${live?'<div class="cam"><video playsinline muted id="cv"></video><div class="aim"></div></div><p class="muted small" style="margin:0" id="cmsg">Hold the QR code inside the frame.</p>':'<p class="note">Live camera isn’t allowed in the claude.ai preview. On the company site it scans the moment a code is in frame. Here, take a photo of the label instead, or use a Bluetooth scanner in the box below.</p>'}
  <label class="btn block"><input type="file" accept="image/*" capture="environment" id="cphoto" hidden>Take a photo of the label</label>
  <label class="field"><span>Or type / scan with a Bluetooth scanner</span><input class="in" id="ctxt" autocomplete="off" autocapitalize="characters" placeholder="D 11 a, item #, or scan"></label><button class="btn pri block" data-primary id="cgo3">Go</button>`,sh=>{
  $('#cgo3',sh).addEventListener('click',()=>handleScan($('#ctxt',sh).value));
  $('#cphoto',sh).addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{await loadScript(JSQR_SRC);const img=await createImageBitmap(f);const c=document.createElement('canvas'),s=Math.min(1,1600/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);r?handleScan(r.data):toast('No QR code found in that photo. Get closer and try again.',true)}catch(err){toast(err.message,true)}})});
 if(!live)return;
 try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});const v=$('#cv',sh);if(!v){stream.getTracks().forEach(t=>t.stop());return}CAM={stream};v.srcObject=stream;await v.play();
  const det=('BarcodeDetector' in window)?new BarcodeDetector({formats:['qr_code']}):null;if(!det)await loadScript(JSQR_SRC);
  const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});const me=CAM;
  const tick=async()=>{if(!CAM||me.stop)return;try{if(v.readyState>=2){let txt='';if(det){const r=await det.detect(v);if(r[0])txt=r[0].rawValue}else{c.width=Math.min(800,v.videoWidth);c.height=c.width*v.videoHeight/v.videoWidth;x.drawImage(v,0,0,c.width,c.height);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'dontInvert'});if(r)txt=r.data}
   if(txt){navigator.vibrate&&navigator.vibrate(60);handleScan(txt);return}}}catch(e){}requestAnimationFrame(tick)};tick()}
 catch(e){const m=$('#cmsg',sh);if(m)m.textContent='Camera blocked. Allow camera access for this site, or take a photo instead.'}}
/* Bluetooth scanners type fast and end with Enter: catch that anywhere outside a field */
let kb='',kbT=0;document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea')||!SESS||!ME)return;if(e.key==='Enter'){if(kb.length>2)handleScan(kb);kb='';return}if(e.key.length===1){kb+=e.key;clearTimeout(kbT);kbT=setTimeout(()=>kb='',280)}});

const PREVIEW_HASHES={fcadmin:'602bc4deb231124e2d71a7c24126cfe7d6156e644521eb7872dd64bfaab0dbf1',fcwarehouse:'0ffb68cfb3c296a86231d1ca33139d2ff0cfea7071ee2581f4fbbc445db0908e'};
async function boot(){
 render();
 let db=null;try{if(window.claude&&claude.use)db=await claude.use('db')}catch(e){}
 if(db){MODE='claude';STORE=claudeStore(db)}
 else if(location.protocol.startsWith('http')&&!window.claude){try{const r=await fetch('/api/ping');if(r.ok&&(await r.json()).ok){MODE='server';STORE=serverStore()}}catch(e){}}
 if(!STORE){MODE='local';STORE=localStore()}
 ACCT_H=PREVIEW_HASHES;
 ME=sget(NAME_K);
 if(MODE!=='server'||SESS)STORE.start(onData);else render();
}
boot();
